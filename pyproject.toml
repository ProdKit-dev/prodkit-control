[project]
name = "prodkit-control-workspace"
version = "0.1.0"
description = "Provider-neutral intent-to-production control, lineage, assurance, and reconciliation plane."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "prodkit-control-core",
  "prodkit-control-runtime",
  "prodkit-control-fastapi",
  "prodkit-control-cli",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
  "packages/python/prodkit-control-core",
  "packages/python/prodkit-control-runtime",
  "packages/python/prodkit-control-postgres",
  "packages/python/prodkit-control-fastapi",
  "packages/python/prodkit-control-cli",
  "packages/python/integrations/*",
  "packages/python/executors/*",
  "packages/python/providers/*",
  "packages/python/reconcilers/*",
]

[tool.uv.sources]
prodkit-control-core = { workspace = true }
prodkit-control-runtime = { workspace = true }
prodkit-control-postgres = { workspace = true }
prodkit-control-fastapi = { workspace = true }
prodkit-control-cli = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=prodkit_control_core --cov=prodkit_control_runtime --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["prodkit_control_core", "prodkit_control_runtime"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B", "RUF", "PTH", "ARG", "T20", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S"]
"examples/**/*.py" = ["T20", "S"]
"scripts/**/*.py" = ["T20"]
"**/__init__.py" = ["F401", "F403"]
"packages/python/prodkit-control-fastapi/src/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "packages/python/prodkit-control-core/src",
  "packages/python/prodkit-control-runtime/src",
  "packages/python/prodkit-control-fastapi/src",
  "packages/python/prodkit-control-cli/src",
  "packages/python/prodkit-control-postgres/src",
]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

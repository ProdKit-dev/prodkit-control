[project]
name = "prodkit-executor-github"
version = "0.8.0"
description = "Controlled GitHub executor boundary."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.28,<1",
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_executor_github"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

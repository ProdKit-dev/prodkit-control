[project]
name = "prodkit-executor-database"
version = "0.9.0"
description = "Controlled PostgreSQL executor for allowlisted parameterized operations."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "asyncpg>=0.30,<1",
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_executor_database"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

[project]
name = "prodkit-executor-kubernetes"
version = "0.9.0"
description = "Constrained Kubernetes Deployment executor using short-lived bearer credentials."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.28,<1",
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_executor_kubernetes"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

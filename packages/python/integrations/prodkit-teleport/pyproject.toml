[project]
name = "prodkit-teleport"
version = "0.8.0"
description = "Teleport privileged-access evidence adapter."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_teleport"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

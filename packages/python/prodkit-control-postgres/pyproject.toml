[project]
name = "prodkit-control-postgres"
version = "0.1.0"
description = "Append-only PostgreSQL event-ledger and lineage adapter for ProdKit Control."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "asyncpg>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_control_postgres"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

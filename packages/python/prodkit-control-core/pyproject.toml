[project]
name = "prodkit-control-core"
version = "0.0.0"
description = "Canonical provider-neutral lineage, control, integrity, and assurance contracts."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.12,<3"]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_control_core"

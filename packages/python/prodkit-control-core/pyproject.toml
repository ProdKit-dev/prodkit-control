[project]
name = "prodkit-control-core"
version = "0.9.1"
description = "Canonical provider-neutral lineage, control, integrity, and assurance contracts."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.12,<3"]

readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_control_core"

[project.urls]
Homepage = "https://github.com/ProdKit-dev/prodkit-control"
Repository = "https://github.com/ProdKit-dev/prodkit-control.git"
Documentation = "https://github.com/ProdKit-dev/prodkit-control/tree/main/docs"
Issues = "https://github.com/ProdKit-dev/prodkit-control/issues"

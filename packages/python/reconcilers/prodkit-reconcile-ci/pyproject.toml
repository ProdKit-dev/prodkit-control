[project]
name = "prodkit-reconcile-ci"
version = "0.6.0"
description = "CI workflow reconciliation adapter."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_reconcile_ci"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

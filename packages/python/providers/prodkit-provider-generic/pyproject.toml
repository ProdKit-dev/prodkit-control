[project]
name = "prodkit-provider-generic"
version = "0.2.0"
description = "Generic callable model-provider adapter."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_provider_generic"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

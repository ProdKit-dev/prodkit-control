[project]
name = "prodkit-provider-anthropic"
version = "0.9.0"
description = "Anthropic Messages API normalization adapter for canonical model requests and responses."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "prodkit-control-core",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_provider_anthropic"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

[project]
name = "prodkit-provider-openai"
version = "0.9.1"
description = "OpenAI model-provider normalization adapter for canonical requests, responses, usage, and tool proposals."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "prodkit-control-core",
]

readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_provider_openai"

[tool.uv.sources]
prodkit-control-core = { workspace = true }

[project.urls]
Homepage = "https://github.com/ProdKit-dev/prodkit-control"
Repository = "https://github.com/ProdKit-dev/prodkit-control.git"
Documentation = "https://github.com/ProdKit-dev/prodkit-control/tree/main/docs"
Issues = "https://github.com/ProdKit-dev/prodkit-control/issues"

[project]
name = "prodkit-control-cli"
version = "0.6.1"
description = "CLI for local operation and evidence verification."
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "typer>=0.16,<1",
  "prodkit-control-core",
  "prodkit-control-runtime",
]

[project.scripts]
prodkit-control = "prodkit_control_cli.main:app"

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prodkit_control_cli"

[tool.uv.sources]
prodkit-control-core = { workspace = true }
prodkit-control-runtime = { workspace = true }

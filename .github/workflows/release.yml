name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      prerelease:
        description: Mark GitHub Release as prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: release
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release.yml@bcff80f7b5570b231f3b0f9d6cf24fd2600be497
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ github.sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      required_workflows_json: '["CI","Security","CodeQL"]'
      proof_workflow_file: .github/workflows/trusted-release-proof.yml
      reuse_proof_payload: true
      python_enabled: true
      python_version: "3.13"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "10.15.0"
      generate_sbom: true
      # GitHub-native attestation persistence is unavailable for this private
      # repository under the current organization plan. Exact-source proof,
      # SHA256SUMS, release metadata, and SPDX SBOM remain mandatory.
      attest: false
      environment: release

name: Release

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  security-events: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ startsWith(github.event.head_commit.message, 'release: v') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v$version"
          subject="$(git log -1 --format=%s)"
          test "$subject" = "release: $tag"
          test -f "docs/releases/$tag.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.0"
          python-version: "3.13"
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked workspaces
        run: |
          uv sync --all-packages --group dev --locked
          pnpm install --frozen-lockfile

      - name: Verify release source contract
        run: uv run python scripts/release_check.py --version "${{ steps.release.outputs.version }}"

      - name: Verify Python source
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest --cov-report=term-missing
          uv run python scripts/export_schemas.py --check

      - name: Verify TypeScript source
        run: |
          pnpm typecheck:ts
          pnpm build:ts

      - name: Audit dependencies
        run: |
          uv run --with pip-audit==2.10.1 pip-audit --local --skip-editable
          pnpm audit --audit-level=high

      - name: Initialize CodeQL release proof
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python,javascript-typescript,actions

      - name: Analyze release source locally
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          upload: never
          upload-database: false
          output: .release-evidence/codeql

      - name: Enforce zero CodeQL findings
        run: python3 scripts/check_codeql_sarif.py .release-evidence/codeql

      - name: Preserve CodeQL evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prodkit-control-${{ steps.release.outputs.tag }}-codeql
          path: .release-evidence/codeql/*.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Build all release distributions
        shell: bash
        run: |
          rm -rf .release
          mkdir -p .release/assets
          uv build --all-packages --out-dir .release/assets
          for package_dir in packages/typescript/*; do
            test -f "$package_dir/package.json" || continue
            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/.release/assets"
          done

      - name: Inspect all release distributions
        run: |
          uv run python scripts/inspect_release_artifacts.py \
            .release/assets \
            --version "${{ steps.release.outputs.version }}"

      - name: Generate release checksums
        shell: bash
        run: |
          (
            cd .release/assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > .release/assets/SHA256SUMS
          test -s .release/assets/SHA256SUMS
          cat .release/assets/SHA256SUMS

      - name: Preserve verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prodkit-control-${{ steps.release.outputs.tag }}
          path: .release/assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or verify immutable release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/ensure_release_tag.py \
            --tag "${{ steps.release.outputs.tag }}" \
            --sha "$GITHUB_SHA"

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find .release/assets -maxdepth 1 -type f -print | sort)
          uv run python scripts/publish_release.py \
            --tag "${{ steps.release.outputs.tag }}" \
            --notes "docs/releases/${{ steps.release.outputs.tag }}.md" \
            "${assets[@]}"

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      target_sha:
        description: Exact current main SHA with successful CI, Security, CodeQL, and Trusted Release Proof
        required: true
        type: string
      prerelease:
        description: Mark GitHub Release as prerelease
        required: true
        default: false
        type: boolean
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  runner:
    name: runner
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-runner-policy.yml@239a8efe4da989251889777814eafe94cbd9df97
    with:
      mode: ${{ inputs.runner }}
      fork_safe: false

  release:
    name: release
    needs: runner
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-pipeline.yml@239a8efe4da989251889777814eafe94cbd9df97
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ inputs.target_sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: ${{ needs.runner.outputs.runner_json }}
      proof_workflow: Trusted Release Proof
      proof_workflow_file: trusted-release-proof.yml
      required_push_workflows_json: '["CI","Security","CodeQL"]'
      python_enabled: true
      python_version: "3.13"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "10.15.0"
      generate_sbom: true
      # GitHub artifact attestations are unavailable for this private repository
      # on the current organization plan. Supply-chain evidence remains mandatory
      # through exact-source Trusted Release Proof, CI/Security/CodeQL, SPDX SBOM,
      # SHA256SUMS, sealed Actions artifacts, and post-publication checksum checks.
      attest: false
      environment: release

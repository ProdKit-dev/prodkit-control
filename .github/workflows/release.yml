name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      target_sha:
        description: Exact current main SHA with successful permanent gates
        required: true
        type: string
      prerelease:
        description: Mark GitHub Release as prerelease
        required: true
        default: false
        type: boolean
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - auto
          - github-hosted
          - self-hosted

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  runner-probe:
    name: Hosted runner availability
    if: >-
      (inputs.runner == 'auto') ||
      ((inputs.runner == 'policy') &&
       ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub-hosted runner availability
        run: echo "GitHub-hosted runner is available"

  release:
    name: release
    needs: runner-probe
    if: >-
      always() && !cancelled() &&
      (needs.runner-probe.result == 'success' ||
       needs.runner-probe.result == 'failure' ||
       needs.runner-probe.result == 'skipped')
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release.yml@3587dc8db2c0ca6aadcd4fc259344df8e29521a1
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ inputs.target_sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: ${{ (((inputs.runner == 'self-hosted') || ((inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted'))) || (needs.runner-probe.result == 'failure')) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      required_workflows_json: '["CI","Security","CodeQL"]'
      python_enabled: true
      python_version: "3.13"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "10.15.0"
      generate_sbom: true
      attest: true
      environment: release

name: Ops v0.4.0 Mypy Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/v0.4.0-ha-scale'
    runs-on: ${{ vars.PRODKIT_RUNNER_JSON != '' && fromJSON(vars.PRODKIT_RUNNER_JSON) || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v0.4.0-ha-scale
          fetch-depth: 0
          persist-credentials: true

      - name: Apply type-narrowing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/python/prodkit-control-runtime/src/prodkit_control_runtime/ha.py')
          text = path.read_text(encoding='utf-8')
          old = '''            current = slot.current if slot is not None else None
            if not self._matches(current, lease) or current is None or current.is_expired(now):
                raise LeaseLostError("cannot renew a stale, released, or expired lease")
            renewed = current.model_copy(
                update={"expires_at": now + timedelta(seconds=ttl_seconds)}
            )
            slot.current = renewed
'''
          new = '''            if slot is None:
                raise LeaseLostError("cannot renew a stale, released, or expired lease")
            current = slot.current
            if not self._matches(current, lease) or current is None or current.is_expired(now):
                raise LeaseLostError("cannot renew a stale, released, or expired lease")
            renewed = current.model_copy(
                update={"expires_at": now + timedelta(seconds=ttl_seconds)}
            )
            slot.current = renewed
'''
          if old not in text:
              raise SystemExit('renew narrowing anchor not found')
          text = text.replace(old, new, 1)

          old = '''            current = slot.current if slot is not None else None
            if not self._matches(current, lease) or current is None or current.is_expired(now):
                raise LeaseLostError("cannot release a stale, replaced, or expired lease")
            slot.current = None
'''
          new = '''            if slot is None:
                raise LeaseLostError("cannot release a stale, replaced, or expired lease")
            current = slot.current
            if not self._matches(current, lease) or current is None or current.is_expired(now):
                raise LeaseLostError("cannot release a stale, replaced, or expired lease")
            slot.current = None
'''
          if old not in text:
              raise SystemExit('release narrowing anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          uv sync --all-packages --group dev --locked --python 3.13
          uv run --python 3.13 --no-sync ruff format packages/python/prodkit-control-runtime/src/prodkit_control_runtime/ha.py
          uv run --python 3.13 --no-sync ruff check packages/python/prodkit-control-runtime/src/prodkit_control_runtime/ha.py
          uv run --python 3.13 --no-sync mypy packages/python/prodkit-control-runtime/src/prodkit_control_runtime/ha.py

      - name: Commit fix and remove operator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ops-v040-mypy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/python/prodkit-control-runtime/src/prodkit_control_runtime/ha.py .github/workflows/ops-v040-mypy-fix.yml
          git commit -m "fix(runtime): narrow lease slot ownership"
          git push origin HEAD:feat/v0.4.0-ha-scale

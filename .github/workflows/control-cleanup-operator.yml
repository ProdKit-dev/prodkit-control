# Disposable observer; never merge.
name: Control Cleanup Observer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/control-cleanup-operator.yml

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: Observe exact-main gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: 37e6d9840b8634dde505df3a3a28b0c94e7ee25a
    steps:
      - name: Read exact-main push gates once
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["EXPECTED_MAIN_SHA"]
          query = urllib.parse.urlencode({"head_sha": sha, "event": "push", "per_page": 100})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?{query}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "prodkit-control-cleanup-observer",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              data = json.load(response)

          required = {"CI", "Security", "CodeQL"}
          latest = {}
          for run in data.get("workflow_runs") or []:
              name = run.get("name")
              if name not in required:
                  continue
              current = latest.get(name)
              key = (run.get("run_number") or 0, run.get("run_attempt") or 0, run.get("id") or 0)
              current_key = (-1, -1, -1) if current is None else (
                  current.get("run_number") or 0,
                  current.get("run_attempt") or 0,
                  current.get("id") or 0,
              )
              if key > current_key:
                  latest[name] = run

          result = {
              name: {
                  "id": latest.get(name, {}).get("id"),
                  "status": latest.get(name, {}).get("status"),
                  "conclusion": latest.get(name, {}).get("conclusion"),
                  "url": latest.get(name, {}).get("html_url"),
              }
              for name in sorted(required)
          }
          print("EXACT_MAIN_GATES=" + json.dumps(result, sort_keys=True))
          PY

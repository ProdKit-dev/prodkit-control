# Disposable cleanup operator. Never merge.
name: Control Cleanup Operator

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  phase-a:
    name: Verify main and dispatch canonical cleanup dry-run
    if: github.head_ref == 'ops/control-cleanup-31803a8c'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: 31803a8ce53e79100eee7b56d0f3d6a29050a0e5
      BRANCHES_JSON: '["chore/adopt-workflows-v0.1.1","chore/resumable-release-lifecycle","feat/v0.2.0-delivery-chain-reconciliation","fix/cleanup-runner-policy","fix/v0.2.0-release-deadlock","ops/control-cleanup-37e6d984","ops/v0.2.0-bootstrap-base","ops/v0.2.0-finalize"]'
    steps:
      - name: Verify exact-main gates and dispatch dry-run
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED_MAIN_SHA"]
          branches_json = os.environ["BRANCHES_JSON"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-cleanup-operator",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          actual = get_json(f"https://api.github.com/repos/{repo}/branches/main")["commit"]["sha"]
          if actual != expected:
              raise SystemExit(f"main moved: expected {expected}, found {actual}")

          query = urllib.parse.urlencode({"head_sha": expected, "event": "push", "per_page": 100})
          data = get_json(f"https://api.github.com/repos/{repo}/actions/runs?{query}")
          required = {"CI", "Security", "CodeQL"}
          latest = {}
          for run in data.get("workflow_runs") or []:
              name = run.get("name")
              if name not in required:
                  continue
              current = latest.get(name)
              key = (run.get("run_number") or 0, run.get("run_attempt") or 0, run.get("id") or 0)
              old = (-1, -1, -1) if current is None else (
                  current.get("run_number") or 0,
                  current.get("run_attempt") or 0,
                  current.get("id") or 0,
              )
              if key > old:
                  latest[name] = run

          result = {
              name: {
                  "id": latest.get(name, {}).get("id"),
                  "status": latest.get(name, {}).get("status"),
                  "conclusion": latest.get(name, {}).get("conclusion"),
                  "url": latest.get(name, {}).get("html_url"),
              }
              for name in sorted(required)
          }
          print("EXACT_MAIN_GATES=" + json.dumps(result, sort_keys=True))
          if not all(
              latest.get(name, {}).get("status") == "completed"
              and latest.get(name, {}).get("conclusion") == "success"
              for name in required
          ):
              print("CLEANUP_DRY_RUN_DISPATCHED=false")
              raise SystemExit(0)

          before = datetime.datetime.now(datetime.timezone.utc)
          payload = json.dumps({
              "ref": "main",
              "inputs": {"branches_json": branches_json, "dry_run": "true"},
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/branch-cleanup.yml/dispatches",
              data=payload,
              method="POST",
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(f"unexpected dispatch status {response.status}")

          run_id = None
          for _ in range(12):
              runs = get_json(
                  f"https://api.github.com/repos/{repo}/actions/workflows/branch-cleanup.yml/runs?event=workflow_dispatch&branch=main&per_page=20"
              ).get("workflow_runs") or []
              candidates = []
              for run in runs:
                  if run.get("head_sha") != expected:
                      continue
                  created = run.get("created_at")
                  if not created:
                      continue
                  stamp = datetime.datetime.fromisoformat(created.replace("Z", "+00:00"))
                  if stamp >= before - datetime.timedelta(seconds=3):
                      candidates.append(run)
              if candidates:
                  run_id = max(candidates, key=lambda item: item.get("id") or 0).get("id")
                  break
              time.sleep(1)
          if run_id is None:
              raise SystemExit("dry-run dispatched but run id was not observed")
          print("CLEANUP_DRY_RUN_DISPATCHED=true")
          print(f"DRY_RUN_ID={run_id}")
          PY

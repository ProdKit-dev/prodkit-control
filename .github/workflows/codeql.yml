name: CodeQL

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: true

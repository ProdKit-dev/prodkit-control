name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'ops/final-v0.1.0-closure') }}
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-codeql.yml@645f3c66557e4a673be38c461a762021536fda00
    with:
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      languages_json: '["python","javascript-typescript","actions"]'
      check_script: .prodkit/workflows/codeql-check.sh

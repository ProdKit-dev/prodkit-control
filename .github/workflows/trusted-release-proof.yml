name: Trusted Release Proof

run-name: Trusted Release Proof — ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: proof
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-proof.yml@645f3c66557e4a673be38c461a762021536fda00
    with:
      source_sha: ${{ github.sha }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      proof_script: .prodkit/workflows/release-proof.sh
      python_enabled: true
      python_version: "3.13"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "10.15.0"

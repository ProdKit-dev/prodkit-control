name: Trusted Release Proof

run-name: Trusted Release Proof — ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proof:
    name: proof
    permissions:
      contents: read
      actions: read
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-proof.yml@d117932d61e0bc45ec065dfc13728b71c6ceb9f3
    with:
      source_sha: ${{ github.sha }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      proof_script: .prodkit/workflows/release-proof.sh
      timeout_minutes: 90
      required_workflows_json: '["CI","Security","CodeQL"]'
      manifest_path: .prodkit/release.json
      prepare_release_payload: true
      python_enabled: true
      python_version: "3.13"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "10.15.0"

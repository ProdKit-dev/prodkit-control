name: CI

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  finalize-v040:
    if: github.event.pull_request.head.ref == 'ops/v0.4.0-finalize' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.PRODKIT_RUNNER_JSON != '' && fromJSON(vars.PRODKIT_RUNNER_JSON) || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    env:
      TARGET_SHA: be19defdafe9ecb6552f722c1fd344f3d9d07a27
      RELEASE_RUN_ID: "32657765488"
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify v0.4.0 release and independent verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          release_run_id = int(os.environ['RELEASE_RUN_ID'])
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/runs?per_page=100'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'prodkit-control-v040-finalizer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']

          release_candidates = [
              run for run in runs
              if run.get('path') == '.github/workflows/release.yml'
              and run.get('event') == 'workflow_dispatch'
              and run.get('head_sha') == sha
          ]
          verification_candidates = [
              run for run in runs
              if run.get('path') == '.github/workflows/release-verification.yml'
              and run.get('event') == 'workflow_dispatch'
          ]
          release_candidates.sort(key=lambda item: item['id'], reverse=True)
          verification_candidates.sort(key=lambda item: item['id'], reverse=True)
          print('V040_RELEASES=' + json.dumps([
              {'id': r['id'], 'head_sha': r['head_sha'], 'status': r['status'], 'conclusion': r['conclusion'], 'html_url': r['html_url']}
              for r in release_candidates[:5]
          ], sort_keys=True))
          print('V040_VERIFICATIONS=' + json.dumps([
              {'id': r['id'], 'head_sha': r['head_sha'], 'head_branch': r['head_branch'], 'status': r['status'], 'conclusion': r['conclusion'], 'html_url': r['html_url']}
              for r in verification_candidates[:10]
          ], sort_keys=True))

          release = next((r for r in release_candidates if int(r['id']) == release_run_id), None)
          if not release or release['status'] != 'completed' or release['conclusion'] != 'success':
              raise SystemExit(f'exact Release not successful: {release}')

          exact_verifications = [r for r in verification_candidates if r.get('head_sha') == sha]
          if not exact_verifications:
              raise SystemExit('exact-source Release Verification not found yet')
          verification = exact_verifications[0]
          if verification['status'] != 'completed' or verification['conclusion'] != 'success':
              raise SystemExit(f'exact-source Release Verification not successful yet: {verification}')
          print('V040_VERIFIED_RUN_ID=' + str(verification['id']))
          PY

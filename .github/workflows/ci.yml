name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'feat/v0.2.0-delivery-chain-reconciliation' }}
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-ci-compact.yml@645f3c66557e4a673be38c461a762021536fda00
    with:
      runner_json: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || (vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
      hygiene_enabled: true
      hygiene_script: .prodkit/workflows/ci-hygiene.sh
      python_enabled: true
      python_versions_json: '["3.12","3.13","3.14"]'
      python_script: .prodkit/workflows/ci-python.sh
      node_enabled: true
      node_versions_json: '["22","24"]'
      node_script: .prodkit/workflows/ci-node.sh
      postgres_enabled: true
      postgres_image: postgres:18-alpine
      postgres_script: .prodkit/workflows/ci-postgres.sh
      container_enabled: false
      custom_enabled: false

  bootstrap-v020:
    name: Bootstrap v0.2.0 candidate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/v0.2.0-delivery-chain-reconciliation' }}
    runs-on: ${{ fromJSON(vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.2.0-delivery-chain-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize, validate, and finalize v0.2.0 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse origin/main)" = "89a7546ec06a2eecc59d2150c037d25c866a1538"

          python3 scripts/set_release_version.py 0.2.0

          python3 - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          anchor = "## [Unreleased]\n"
          section = """## [0.2.0] - 2026-08-22

### Added

- Delivery-chain reconciliation across Git, GitHub, CI/build, registries, deployments,
  Kubernetes, and database/control-plane evidence.
- Canonical external state/audit contracts, deterministic reconciliation findings, durable
  cursors, external audit-event deduplication, and tenant production-completeness profiles.
- PostgreSQL schema version 4 with real PostgreSQL 18 durability coverage for reconciliation
  cursors, findings, results, audit evidence, and profiles.
- Configurable polling, source freshness, capped exponential backoff, provider-contract
  fixtures, and documented reconciliation SLO/escalation policy.

### Changed

- Reconciliation is fail-closed for stale, unavailable, conflicting, missing, and unexpected
  external evidence; unknown provider state can no longer be interpreted as matched.
- Production completeness can require fresh healthy matched evidence from an explicit
  tenant-scoped source set.

### Security

- Delivery-chain activity without a corresponding controlled action produces a high-severity
  `unexpected_external_action` finding.
- Conflicting evidence is represented explicitly as `conflicting_evidence` rather than
  silently selecting one provider observation.

### Release scope

`v0.2.0` is the delivery-chain reconciliation milestone. Signed/interoperable provenance and
key-management remain the `v0.3.0` milestone.

"""
          if "## [0.2.0] - " not in text:
              if anchor not in text:
                  raise SystemExit("CHANGELOG Unreleased anchor missing")
              text = text.replace(anchor, anchor + "\n" + section, 1)
              path.write_text(text, encoding="utf-8")
          PY

          uv lock
          uv sync --all-packages --group dev --python 3.13
          uv run --python 3.13 --no-sync ruff format .
          uv run --python 3.13 --no-sync python scripts/export_schemas.py

          PRODKIT_PYTHON_VERSION=3.13 .prodkit/workflows/ci-python.sh
          uv run --python 3.13 --no-sync python scripts/release_check.py --version 0.2.0
          git diff --check

          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare v0.2.0 candidate'
          git push origin HEAD:feat/v0.2.0-delivery-chain-reconciliation

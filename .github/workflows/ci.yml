name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: runner
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-runner-policy.yml@877aefdeaa2084b47f4867dc6c7b0dfe6525fb2c
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'policy' }}
      fork_safe: true

  ci:
    name: ci
    needs: runner
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-ci.yml@877aefdeaa2084b47f4867dc6c7b0dfe6525fb2c
    with:
      runner_json: ${{ needs.runner.outputs.runner_json }}
      hygiene_enabled: true
      hygiene_script: .prodkit/workflows/ci-hygiene.sh
      python_enabled: true
      python_versions_json: '["3.12","3.13","3.14"]'
      python_script: .prodkit/workflows/ci-python.sh
      node_enabled: true
      node_versions_json: '["22","24"]'
      node_script: .prodkit/workflows/ci-node.sh
      postgres_enabled: true
      postgres_image: postgres:18-alpine
      postgres_script: .prodkit/workflows/ci-postgres.sh
      container_enabled: false
      custom_enabled: false

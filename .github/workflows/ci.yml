name: CI

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  finalize-v040:
    if: github.event.pull_request.head.ref == 'ops/v0.4.0-finalize' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.PRODKIT_RUNNER_JSON != '' && fromJSON(vars.PRODKIT_RUNNER_JSON) || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    env:
      TARGET_SHA: be19defdafe9ecb6552f722c1fd344f3d9d07a27
      VERIFICATION_RUN_ID: "32658414309"
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Dispatch canonical v0.4.0 cleanup dry-run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          verification_run_id = os.environ['VERIFICATION_RUN_ID']
          token = os.environ['GH_TOKEN']
          root = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'prodkit-control-v040-cleanup-dry-run',
          }

          def api(method, path, payload=None):
              raw = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  root + path,
                  data=raw,
                  method=method,
                  headers={**headers, **({'Content-Type': 'application/json'} if raw else {})},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return None if not body else json.loads(body)

          main = api('GET', '/git/ref/heads/main')
          if main['object']['sha'] != sha:
              raise SystemExit(f'main moved: {main["object"]["sha"]} != {sha}')
          verification = api('GET', f'/actions/runs/{verification_run_id}')
          if verification.get('path') != '.github/workflows/release-verification.yml':
              raise SystemExit('verification run is not canonical Release Verification')
          if verification.get('head_sha') != sha or verification.get('conclusion') != 'success':
              raise SystemExit('exact-source independent verification is not successful')

          branches = ['feat/v0.4.0-ha-scale', 'ops/v0.4.0-main-gate-inspector']
          payload = {
              'ref': 'main',
              'inputs': {
                  'branches_json': json.dumps(branches, separators=(',', ':')),
                  'dry_run': 'true',
                  'expected_default_sha': sha,
              },
          }
          api('POST', '/actions/workflows/branch-cleanup.yml/dispatches', payload)
          print('V040_CLEANUP_DRY_RUN_DISPATCHED=' + json.dumps(branches))
          PY

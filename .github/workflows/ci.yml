name: CI

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  finalize-v040:
    if: github.event.pull_request.head.ref == 'ops/v0.4.0-finalize' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.PRODKIT_RUNNER_JSON != '' && fromJSON(vars.PRODKIT_RUNNER_JSON) || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    env:
      TARGET_SHA: be19defdafe9ecb6552f722c1fd344f3d9d07a27
      DRY_RUN_DISPATCHER_RUN_ID: "32658961656"
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify dry-run, close finalizer PR, and dispatch real cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          dispatcher_run_id = int(os.environ['DRY_RUN_DISPATCHER_RUN_ID'])
          token = os.environ['GH_TOKEN']
          root = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'prodkit-control-v040-cleanup-finalizer',
          }

          def api(method, path, payload=None):
              raw = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  root + path,
                  data=raw,
                  method=method,
                  headers={**headers, **({'Content-Type': 'application/json'} if raw else {})},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return None if not body else json.loads(body)

          main = api('GET', '/git/ref/heads/main')
          if main['object']['sha'] != sha:
              raise SystemExit(f'main moved: {main["object"]["sha"]} != {sha}')

          runs = api('GET', '/actions/runs?per_page=100')['workflow_runs']
          cleanup_runs = [
              run for run in runs
              if run.get('path') == '.github/workflows/branch-cleanup.yml'
              and run.get('event') == 'workflow_dispatch'
              and run.get('head_sha') == sha
              and int(run['id']) > dispatcher_run_id
          ]
          cleanup_runs.sort(key=lambda item: int(item['id']), reverse=True)
          if not cleanup_runs:
              raise SystemExit('canonical cleanup dry-run has not materialized yet')
          dry_run = cleanup_runs[0]
          print('V040_CLEANUP_DRY_RUN=' + json.dumps({
              'id': dry_run['id'],
              'status': dry_run['status'],
              'conclusion': dry_run['conclusion'],
              'html_url': dry_run['html_url'],
          }, sort_keys=True))
          if dry_run['status'] != 'completed' or dry_run['conclusion'] != 'success':
              raise SystemExit(f'canonical cleanup dry-run not successful: {dry_run}')

          pr = api('GET', '/pulls/46')
          if pr.get('merged'):
              raise SystemExit('refusing cleanup: disposable PR #46 was unexpectedly merged')
          if pr.get('state') != 'closed':
              closed = api('PATCH', '/pulls/46', {'state': 'closed'})
              if closed.get('state') != 'closed' or closed.get('merged'):
                  raise SystemExit('failed to close disposable PR #46 safely')
          print('V040_FINALIZER_PR_CLOSED=true')

          branches = [
              'feat/v0.4.0-ha-scale',
              'ops/v0.4.0-main-gate-inspector',
              'ops/v0.4.0-finalize',
          ]
          api('POST', '/actions/workflows/branch-cleanup.yml/dispatches', {
              'ref': 'main',
              'inputs': {
                  'branches_json': json.dumps(branches, separators=(',', ':')),
                  'dry_run': 'false',
                  'expected_default_sha': sha,
              },
          })
          print('V040_REAL_CLEANUP_DISPATCHED=' + json.dumps(branches))
          PY

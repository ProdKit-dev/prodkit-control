name: CI

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect-exact-main:
    if: github.event.pull_request.head.ref == 'ops/v0.4.0-main-gate-inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify exact-main CI, Security, and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: be19defdafe9ecb6552f722c1fd344f3d9d07a27
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          required = ("CI", "Security", "CodeQL")
          repo = os.environ["REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"

          def fetch():
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "prodkit-control-main-gate-inspector",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)["workflow_runs"]

          for attempt in range(120):
              latest = {}
              for run in sorted(fetch(), key=lambda item: item["id"], reverse=True):
                  name = run["name"]
                  if (
                      name in required
                      and run["head_sha"] == sha
                      and run["event"] == "push"
                      and name not in latest
                  ):
                      latest[name] = {
                          "id": run["id"],
                          "status": run["status"],
                          "conclusion": run["conclusion"],
                          "html_url": run["html_url"],
                      }
              print("exact-main-gates=" + json.dumps(latest, sort_keys=True), flush=True)
              if all(name in latest and latest[name]["status"] == "completed" for name in required):
                  failed = {
                      name: latest[name]
                      for name in required
                      if latest[name]["conclusion"] != "success"
                  }
                  if failed:
                      raise SystemExit("exact-main gate failure: " + json.dumps(failed, sort_keys=True))
                  print("EXACT_MAIN_GATES_SUCCESS=" + json.dumps(latest, sort_keys=True))
                  raise SystemExit(0)
              if attempt == 119:
                  raise SystemExit("timed out waiting for exact-main gates")
              time.sleep(10)
          PY

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  deployments: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'ops/final-v0.1.0-closure' }}
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-ci-compact.yml@645f3c66557e4a673be38c461a762021536fda00
    with:
      runner_json: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || (vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
      hygiene_enabled: true
      hygiene_script: .prodkit/workflows/ci-hygiene.sh
      python_enabled: true
      python_versions_json: '["3.12","3.13","3.14"]'
      python_script: .prodkit/workflows/ci-python.sh
      node_enabled: true
      node_versions_json: '["22","24"]'
      node_script: .prodkit/workflows/ci-node.sh
      postgres_enabled: true
      postgres_image: postgres:18-alpine
      postgres_script: .prodkit/workflows/ci-postgres.sh
      container_enabled: false
      custom_enabled: false

  finalize-v0-1-0:
    name: Finalize v0.1.0 closure
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ops/final-v0.1.0-closure' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      EXPECTED_MAIN_SHA: 89a7546ec06a2eecc59d2150c037d25c866a1538
      EXPECTED_TAG_SHA: 2145ab98ad310226d8cb422949af1f1e735032a2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact-main gates, clean stale state, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          expected_tag = os.environ["EXPECTED_TAG_SHA"]
          api_root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-final-v010-closure",
          }

          class ApiError(RuntimeError):
              def __init__(self, status: int, body: str) -> None:
                  super().__init__(f"GitHub API {status}: {body}")
                  self.status = status
                  self.body = body

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request_headers = dict(headers)
              if data is not None:
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers=request_headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read()
                      if not raw:
                          return None
                      return json.loads(raw)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  if exc.code == 404:
                      return None
                  raise ApiError(exc.code, body) from exc

          def main_sha() -> str:
              ref = request("GET", "/git/ref/heads/main")
              if ref is None:
                  raise SystemExit("main ref disappeared")
              return str(ref["object"]["sha"])

          def resolve_tag(tag: str) -> str:
              encoded = urllib.parse.quote(tag, safe="")
              ref = request("GET", f"/git/ref/tags/{encoded}")
              if ref is None:
                  raise SystemExit(f"missing immutable tag {tag}")
              obj = ref["object"]
              seen: set[str] = set()
              while obj.get("type") == "tag":
                  sha = str(obj["sha"])
                  if sha in seen:
                      raise SystemExit("tag object cycle detected")
                  seen.add(sha)
                  tag_obj = request("GET", f"/git/tags/{sha}")
                  if tag_obj is None:
                      raise SystemExit("annotated tag object disappeared")
                  obj = tag_obj["object"]
              if obj.get("type") != "commit":
                  raise SystemExit(f"tag does not resolve to commit: {obj}")
              return str(obj["sha"])

          if main_sha() != expected_main:
              raise SystemExit(f"main moved before closure: expected {expected_main}, got {main_sha()}")
          if resolve_tag("v0.1.0") != expected_tag:
              raise SystemExit("immutable v0.1.0 tag moved before closure")

          required = ("CI", "Security", "CodeQL", "Release Metadata")
          deadline = time.time() + 3300
          selected = {}
          while time.time() < deadline:
              params = urllib.parse.urlencode(
                  {"head_sha": expected_main, "event": "push", "per_page": 100}
              )
              payload = request("GET", f"/actions/runs?{params}") or {}
              runs = list(payload.get("workflow_runs", []))
              selected = {}
              for name in required:
                  matches = [run for run in runs if run.get("name") == name]
                  if matches:
                      selected[name] = max(matches, key=lambda run: int(run["id"]))
              print(
                  "exact-main gate snapshot: "
                  + json.dumps(
                      {
                          name: {
                              "id": run.get("id"),
                              "status": run.get("status"),
                              "conclusion": run.get("conclusion"),
                          }
                          for name, run in selected.items()
                      },
                      sort_keys=True,
                  )
              )
              failed = {
                  name: (run.get("id"), run.get("conclusion"))
                  for name, run in selected.items()
                  if run.get("status") == "completed" and run.get("conclusion") != "success"
              }
              if failed:
                  raise SystemExit(f"exact-main gate failure: {failed}")
              if len(selected) == len(required) and all(
                  run.get("status") == "completed" and run.get("conclusion") == "success"
                  for run in selected.values()
              ):
                  break
              time.sleep(15)
          else:
              raise SystemExit("timed out waiting for exact-main CI/Security/CodeQL/Release Metadata")

          if main_sha() != expected_main:
              raise SystemExit("main moved after exact-main gates")
          if resolve_tag("v0.1.0") != expected_tag:
              raise SystemExit("immutable v0.1.0 tag moved after exact-main gates")

          stale_deployments = (6027947861, 6026338746, 6025735799, 6025669950)
          for deployment_id in stale_deployments:
              deployment = request("GET", f"/deployments/{deployment_id}")
              if deployment is None:
                  print(f"deployment {deployment_id} already absent")
                  continue
              statuses = request("GET", f"/deployments/{deployment_id}/statuses?per_page=100") or []
              latest_state = statuses[0].get("state") if statuses else None
              if latest_state != "inactive":
                  request(
                      "POST",
                      f"/deployments/{deployment_id}/statuses",
                      {"state": "inactive", "description": "Superseded by verified v0.1.0 closure"},
                  )
              request("DELETE", f"/deployments/{deployment_id}")
              if request("GET", f"/deployments/{deployment_id}") is not None:
                  raise SystemExit(f"failed to delete stale deployment {deployment_id}")
              print(f"deleted stale deployment {deployment_id}")

          stale_runs = (32518726762, 32509402978, 32505822475, 32505427678)
          for run_id in stale_runs:
              run = request("GET", f"/actions/runs/{run_id}")
              if run is None:
                  print(f"workflow run {run_id} already absent")
                  continue
              request("DELETE", f"/actions/runs/{run_id}")
              if request("GET", f"/actions/runs/{run_id}") is not None:
                  raise SystemExit(f"failed to delete stale workflow run {run_id}")
              print(f"deleted stale workflow run {run_id}")

          stale_branches = (
              "fix/clean-release-metadata-state",
              "ops/state-diagnostic",
              "ops/state-diagnostic-base",
              "ops/final-v0.1.0-closure",
          )
          for branch in stale_branches:
              encoded = urllib.parse.quote(branch, safe="")
              ref = request("GET", f"/git/ref/heads/{encoded}")
              if ref is None:
                  print(f"branch {branch} already absent")
                  continue
              request("DELETE", f"/git/refs/heads/{encoded}")
              if request("GET", f"/git/ref/heads/{encoded}") is not None:
                  raise SystemExit(f"failed to delete stale branch {branch}")
              print(f"deleted stale branch {branch}")

          if main_sha() != expected_main:
              raise SystemExit("main moved during closure cleanup")
          if resolve_tag("v0.1.0") != expected_tag:
              raise SystemExit("immutable v0.1.0 tag moved during closure cleanup")

          print(
              "V0_1_0_CLOSED "
              + json.dumps(
                  {
                      "main_sha": expected_main,
                      "tag_sha": expected_tag,
                      "gates": {name: int(run["id"]) for name, run in selected.items()},
                  },
                  sort_keys=True,
              )
          )
          PY

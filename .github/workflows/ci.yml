name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov-report=xml

      - name: Verify generated schemas
        run: uv run python scripts/export_schemas.py --check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck:ts

      - name: Build
        run: pnpm build:ts

  security:
    name: Dependency Audit
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.0"
          python-version: "3.13"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-packages --group dev --locked

      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit --local --skip-editable

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit TypeScript dependencies
        run: pnpm audit --audit-level=high

  packaging:
    name: Release Artifact Proof
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.0"
          python-version: "3.13"
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked workspaces
        run: |
          uv sync --all-packages --group dev --locked
          pnpm install --frozen-lockfile

      - name: Build all distributions
        shell: bash
        run: |
          rm -rf .artifacts/release
          mkdir -p .artifacts/release
          uv build --all-packages --out-dir .artifacts/release
          pnpm build:ts
          for package_dir in packages/typescript/*; do
            test -f "$package_dir/package.json" || continue
            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/.artifacts/release"
          done

      - name: Inspect all distributions
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv run python scripts/inspect_release_artifacts.py .artifacts/release --version "$version"

      - name: Preserve candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: .artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  hygiene:
    name: Repository Hygiene
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify source hygiene
        shell: bash
        run: |
          git diff --check
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python3 scripts/release_check.py --version "$version"

  ci-success:
    name: CI passed
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [python, typescript, security, packaging, hygiene]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Verify all jobs
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$TYPESCRIPT_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$PACKAGING_RESULT" = "success"
          test "$HYGIENE_RESULT" = "success"

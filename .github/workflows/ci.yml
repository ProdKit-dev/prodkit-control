name: CI

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect-exact-main:
    if: github.event.pull_request.head.ref == 'ops/v0.4.0-main-gate-inspector'
    runs-on: ${{ vars.PRODKIT_RUNNER_JSON != '' && fromJSON(vars.PRODKIT_RUNNER_JSON) || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    steps:
      - name: Verify exact-main CI, Security, and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: be19defdafe9ecb6552f722c1fd344f3d9d07a27
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          required = ("CI", "Security", "CodeQL")
          repo = os.environ["REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "prodkit-control-main-gate-inspector",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)["workflow_runs"]

          latest = {}
          for run in sorted(runs, key=lambda item: item["id"], reverse=True):
              name = run["name"]
              if (
                  name in required
                  and run["head_sha"] == sha
                  and run["event"] == "push"
                  and name not in latest
              ):
                  latest[name] = {
                      "id": run["id"],
                      "status": run["status"],
                      "conclusion": run["conclusion"],
                      "html_url": run["html_url"],
                  }
          print("exact-main-gates=" + json.dumps(latest, sort_keys=True))
          missing = [name for name in required if name not in latest]
          incomplete = [
              name for name in required
              if name in latest and latest[name]["status"] != "completed"
          ]
          failed = [
              name for name in required
              if name in latest
              and latest[name]["status"] == "completed"
              and latest[name]["conclusion"] != "success"
          ]
          if missing or incomplete or failed:
              raise SystemExit(
                  "exact-main gates not ready: "
                  + json.dumps(
                      {"missing": missing, "incomplete": incomplete, "failed": failed},
                      sort_keys=True,
                  )
              )
          print("EXACT_MAIN_GATES_SUCCESS=" + json.dumps(latest, sort_keys=True))
          PY

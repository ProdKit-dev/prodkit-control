name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, github-hosted, self-hosted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-ci.yml@df6801a185c32b224d5335ba077fab0a424ecf0f
    with:
      # Temporary canary: prove the private repository can execute the same
      # shared CI contract on the trusted self-hosted runner when hosted jobs
      # are unavailable. This is reverted to policy selection before merge.
      runner_json: '["self-hosted","Linux","X64"]'
      hygiene_enabled: true
      hygiene_script: .prodkit/workflows/ci-hygiene.sh
      python_enabled: true
      python_versions_json: '["3.12","3.13","3.14"]'
      python_script: .prodkit/workflows/ci-python.sh
      node_enabled: true
      node_versions_json: '["22","24"]'
      node_script: .prodkit/workflows/ci-node.sh
      postgres_enabled: false
      container_enabled: false
      custom_enabled: false

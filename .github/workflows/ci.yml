name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-v040-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-v040:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/v0.4.0-ha-scale'
    runs-on: ${{ vars.PRODKIT_RUNNER_JSON != '' && fromJSON(vars.PRODKIT_RUNNER_JSON) || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v0.4.0-ha-scale
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Normalize v0.4.0 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = "packages/python/prodkit-control-fastapi/src/prodkit_control_fastapi/app.py"
          replace(
              app,
              "from collections.abc import Awaitable, Callable\n",
              "from collections.abc import AsyncIterator, Awaitable, Callable\nfrom contextlib import asynccontextmanager\n",
          )
          replace(
              app,
              "from fastapi import Depends, FastAPI, HTTPException, Request, status\n",
              "from fastapi import Depends, FastAPI, HTTPException, Request, status\nfrom starlette.responses import JSONResponse, Response\n",
          )
          replace(
              app,
              "    RunRecord,\n    RunStatus,\n    sha256_hex,\n",
              "    RunRecord,\n    RunStatus,\n    RuntimeDrainingError,\n    sha256_hex,\n",
          )
          replace(
              app,
              "    ProductionLineagePolicy,\n    RunCoordinator,\n)",
              "    ProductionLineagePolicy,\n    REFERENCE_CAPACITY_ENVELOPE,\n    RunCoordinator,\n    RuntimeLifecycle,\n)",
          )
          replace(
              app,
              "    lineage: InMemoryLineageStore\n    lineage_policy: ProductionLineagePolicy\n",
              "    lineage: InMemoryLineageStore\n    lineage_policy: ProductionLineagePolicy\n    lifecycle: RuntimeLifecycle\n",
          )
          replace(
              app,
              "        lineage=InMemoryLineageStore(),\n        lineage_policy=ProductionLineagePolicy(),\n    )",
              "        lineage=InMemoryLineageStore(),\n        lineage_policy=ProductionLineagePolicy(),\n        lifecycle=RuntimeLifecycle(),\n    )",
          )
          replace(
              app,
              "    allow_insecure_header_auth: bool = False,\n) -> FastAPI:",
              "    allow_insecure_header_auth: bool = False,\n    shutdown_grace_seconds: float = REFERENCE_CAPACITY_ENVELOPE.shutdown_grace_seconds,\n) -> FastAPI:",
          )
          replace(
              app,
              "    app = FastAPI(\n",
              "    if shutdown_grace_seconds <= 0:\n        raise ValueError(\"shutdown_grace_seconds must be positive\")\n    configured_services = services or build_services()\n\n    @asynccontextmanager\n    async def lifespan(_: FastAPI) -> AsyncIterator[None]:\n        try:\n            yield\n        finally:\n            await configured_services.lifecycle.begin_draining()\n            await configured_services.lifecycle.wait_for_drain(\n                timeout_seconds=shutdown_grace_seconds\n            )\n            await configured_services.lifecycle.stop()\n\n    app = FastAPI(\n",
          )
          replace(
              app,
              "        title=\"ProdKit Control\",\n",
              "        title=\"ProdKit Control\",\n        lifespan=lifespan,\n",
          )
          replace(
              app,
              "    app.state.services = services or build_services()\n",
              "    app.state.services = configured_services\n",
          )
          replace(
              app,
              "    app.state.allow_insecure_header_auth = allow_insecure_header_auth\n\n    @app.get(\"/healthz\", tags=[\"operations\"])",
              "    app.state.allow_insecure_header_auth = allow_insecure_header_auth\n\n    @app.middleware(\"http\")\n    async def lifecycle_admission(\n        request: Request,\n        call_next: Callable[[Request], Awaitable[Response]],\n    ) -> Response:\n        if request.url.path in {\"/healthz\", \"/readyz\"}:\n            return await call_next(request)\n        try:\n            async with configured_services.lifecycle.admit():\n                return await call_next(request)\n        except RuntimeDrainingError:\n            return JSONResponse(\n                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n                content={\n                    \"detail\": {\n                        \"code\": \"runtime_draining\",\n                        \"message\": \"control replica is draining\",\n                    }\n                },\n                headers={\"Retry-After\": \"1\"},\n            )\n\n    @app.get(\"/healthz\", tags=[\"operations\"])",
          )
          replace(
              app,
              "    async def readyz() -> dict[str, str]:\n        if principal_resolver is None",
              "    async def readyz() -> dict[str, str]:\n        if not configured_services.lifecycle.accepting:\n            raise HTTPException(\n                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n                detail={\n                    \"status\": \"not_ready\",\n                    \"reason\": configured_services.lifecycle.state.value,\n                },\n            )\n        if principal_resolver is None",
          )

          runtime = "packages/python/prodkit-control-runtime/src/prodkit_control_runtime/ha.py"
          replace(
              runtime,
              "    max_queue_depth=10_000,\n    max_in_flight=256,\n    max_per_tenant_in_flight=64,",
              "    max_queue_depth=1_000,\n    max_in_flight=128,\n    max_per_tenant_in_flight=32,",
          )
          replace(
              runtime,
              "    qualification_concurrency=256,\n    qualification_work_items=10_000,",
              "    qualification_concurrency=128,\n    qualification_work_items=1_000,",
          )

          test_ha = "tests/test_ha.py"
          replace(
              test_ha,
              "    LeaseLostError,\n    QueueOverloadedError,",
              "    LeaseLostError,\n    LeasedWorkItem,\n    QueueOverloadedError,",
          )
          replace(
              test_ha,
              "    async def apply_external_effect(leased) -> None:  # type: ignore[no-untyped-def]\n",
              "    async def apply_external_effect(leased: LeasedWorkItem) -> None:\n",
          )

          scale = "scripts/ci_ha_scale.py"
          replace(
              scale,
              "from prodkit_control_core import DurableWorkItem, LeaseLostError, QueueOverloadedError\n",
              "from prodkit_control_core import (\n    DurableWorkItem,\n    LeaseLostError,\n    LeasedWorkItem,\n    QueueOverloadedError,\n)\n",
          )
          replace(
              scale,
              "    async def idempotent_fenced_sink(leased) -> None:  # type: ignore[no-untyped-def]\n",
              "    async def idempotent_fenced_sink(leased: LeasedWorkItem) -> None:\n",
          )

          postgres_ci = "scripts/ci_postgres.py"
          replace(
              postgres_ci,
              "from sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine\n",
              "from sqlalchemy.ext.asyncio import AsyncSession, async_sessionmaker, create_async_engine\n",
          )
          replace(
              postgres_ci,
              "    sessions: async_sessionmaker,\n",
              "    sessions: async_sessionmaker[AsyncSession],\n",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if "## [0.4.0]" not in text:
              marker = "## [Unreleased]\n"
              block = """## [Unreleased]\n\n## [0.4.0] - 2026-08-23\n\n### Added\n\n- Provider-neutral fenced lease and bounded durable-work contracts with Python and TypeScript surfaces.\n- Standalone and PostgreSQL HA implementations with monotonic fencing, database-clock expiry, `SKIP LOCKED` acquisition, bounded retry, and dead-letter state.\n- Global/per-tenant capacity admission, graceful runtime draining, and recoverable scheduler integration.\n- Published capacity envelope, HA operations guidance, and ADR 0001 for failover-safe ownership semantics.\n\n### Changed\n\n- PostgreSQL schema advances additively to version 5 for durable scheduler state.\n- API/runtime replicas drain before shutdown and fail readiness while draining.\n- Scale qualification is a permanent CI release gate on the Python 3.13 lane.\n\n### Security\n\n- Scheduler fencing is explicitly separated from permanent action idempotency ownership; lease expiry never authorizes blind replay of an uncertain external effect.\n- Stale workers cannot acknowledge or retry work after a higher fence is issued.\n- Queue and in-flight admission are bounded so overload fails explicitly instead of becoming unbounded resource consumption.\n\n### Release scope\n\n`v0.4.0` is the high-availability and scale milestone. It qualifies concurrency, failover, bounded load/soak, and no-duplicate external-effect identity under the documented replay-safe failover path. Disaster recovery drills and broader enterprise isolation remain later roadmap milestones.\n"""
              if marker not in text:
                  raise SystemExit("CHANGELOG Unreleased marker missing")
              changelog.write_text(text.replace(marker, block, 1), encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          heading = "## v0.4.0 — High availability and scale\n"
          status = "**Status:** Implemented in v0.4.0; release remains subject to the exact-candidate gates below.\n"
          if heading in text and status not in text:
              roadmap.write_text(text.replace(heading, heading + "\n" + status, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old_start = "## Project status and maturity\n\n`v0.0.0` is the **canonical engineering foundation**."
          if old_start in text:
              section_start = text.index("## Project status and maturity")
              section_end = text.index("Before enabling production actions", section_start)
              replacement = """## Project status and maturity\n\n`v0.4.0` is the **high-availability and scale milestone**. The repository now includes the canonical foundation, hardened execution, delivery-chain reconciliation, portable assurance, and a qualified HA scheduler/control-plane layer. Enterprise assurance remains maturity-gated; later roadmap milestones cover disaster recovery, stronger tenant isolation, legal hold, compliance packs, and independent security review.\n\n| Capability | v0.4.0 status | Next target |\n| --- | --- | --- |\n| Canonical contracts, typed lineage, hash-chained evidence | Implemented | Compatibility hardening |\n| Durable action execution and uncertainty handling | Implemented | Broader executor qualification |\n| Delivery-chain reconciliation | Implemented | Additional provider coverage |\n| Portable attestations and offline verification | Implemented | Enterprise trust/retention profiles |\n| HA fencing, durable bounded work, backpressure, graceful drain | Implemented and qualified | DR / regional recovery |\n| Python/TypeScript canonical surfaces | Implemented | Compatibility policy expansion |\n| Multi-tenant enterprise isolation | Architectural + tenant-scoped controls | Dedicated isolation verification milestone |\n| DR, legal hold, compliance packs, independent security review | Roadmap | 1.0 production assurance profile |\n\n"""
              text = text[:section_start] + replacement + text[section_end:]
          text = text.replace(
              "The diagram is the **target control-plane architecture**. `v0.0.0` implements the canonical foundation and reference boundaries; later roadmap gates harden durable storage, authenticated service wiring, isolated executors, reconciliation, signing, HA/DR, and enterprise isolation.",
              "The diagram is the control-plane architecture through `v0.4.0`: durable execution, reconciliation, portable assurance, and HA scheduling are implemented behind provider-neutral ports. Later roadmap gates focus on DR, stronger enterprise isolation, governance/compliance packs, and independent assurance.",
          )
          if "- [High availability and scale](docs/architecture/high-availability.md)" not in text:
              text = text.replace(
                  "- [Observability](docs/architecture/observability.md)\n",
                  "- [Observability](docs/architecture/observability.md)\n- [High availability and scale](docs/architecture/high-availability.md)\n",
              )
          if "- [Capacity and overload envelope](docs/operations/capacity.md)" not in text:
              text = text.replace(
                  "- [Operations runbook](docs/operations/runbook.md)\n",
                  "- [Operations runbook](docs/operations/runbook.md)\n- [Capacity and overload envelope](docs/operations/capacity.md)\n",
              )
          readme.write_text(text, encoding="utf-8")
          PY

          uv python install 3.13
          python3 scripts/set_release_version.py 0.4.0
          uv lock
          uv sync --all-packages --group dev --locked --python 3.13
          uv run --python 3.13 --no-sync python scripts/export_schemas.py
          uv run --python 3.13 --no-sync ruff format .
          uv run --python 3.13 --no-sync ruff check . --fix
          uv run --python 3.13 --no-sync ruff format .

      - name: Commit normalized candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//')
          if (( ${#changed[@]} == 0 )); then
            echo "No candidate changes to commit"
            exit 0
          fi
          python3 - "${changed[@]}" <<'PY'
          import sys
          allowed_roots = (
              "packages/python/",
              "packages/typescript/",
              "scripts/",
              "tests/",
              "schemas/",
              "docs/",
          )
          allowed_files = {"CHANGELOG.md", "README.md", "ROADMAP.md", "pyproject.toml", "uv.lock"}
          bad = [p for p in sys.argv[1:] if p not in allowed_files and not p.startswith(allowed_roots)]
          if bad:
              raise SystemExit(f"refusing to stage unexpected candidate paths: {bad}")
          PY
          for path in "${changed[@]}"; do
            git add -- "$path"
          done
          git commit -m "release: prepare v0.4.0 candidate"
          git push origin HEAD:feat/v0.4.0-ha-scale

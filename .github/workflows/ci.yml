name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov-report=xml

      - name: Verify generated schemas
        run: uv run python scripts/export_schemas.py --check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  typescript:
    name: TypeScript
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck:ts

      - name: Build
        run: pnpm build:ts

  ci-success:
    name: CI passed
    if: always()
    needs:
      - python
      - typescript
    runs-on: self-hosted

    steps:
      - name: Verify all jobs
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$TYPESCRIPT_RESULT" = "success"

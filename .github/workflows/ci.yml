name: CI

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  finalize-v040:
    if: github.event.pull_request.head.ref == 'ops/v0.4.0-finalize' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.PRODKIT_RUNNER_JSON != '' && fromJSON(vars.PRODKIT_RUNNER_JSON) || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    env:
      TARGET_SHA: be19defdafe9ecb6552f722c1fd344f3d9d07a27
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Inspect v0.4.0 release lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'prodkit-control-v040-finalizer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']

          wanted = ('Trusted Release Proof', 'Release Promotion', 'Release', 'Release Verification')
          latest = {}
          for run in sorted(runs, key=lambda item: item['id'], reverse=True):
              name = run['name']
              if name in wanted and run['head_sha'] == sha and name not in latest:
                  latest[name] = {
                      'id': run['id'],
                      'event': run['event'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                      'html_url': run['html_url'],
                  }
          print('V040_LIFECYCLE=' + json.dumps(latest, sort_keys=True))
          proof = latest.get('Trusted Release Proof')
          if not proof:
              raise SystemExit('Trusted Release Proof run not found for exact source SHA')
          if proof['event'] != 'workflow_dispatch':
              raise SystemExit(f'unexpected proof event: {proof}')
          if proof['status'] != 'completed' or proof['conclusion'] != 'success':
              raise SystemExit(f'Trusted Release Proof not successful yet: {proof}')
          PY

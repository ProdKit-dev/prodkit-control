name: Release Promotion

run-name: Release Promotion — ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}

on:
  workflow_run:
    workflows: ["Trusted Release Proof"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current-main SHA with a completed successful Trusted Release Proof
        required: true
        type: string
      proof_run_id:
        description: Exact successful Trusted Release Proof run ID recorded by the proof/promotion bridge
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  promote:
    name: promote
    if: ${{ (github.event_name == 'workflow_run' && vars.PRODKIT_GITHUB_HOSTED_CONTROL_PLANE == 'true' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: write
      contents: read
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-promote.yml@e77861d685e0aaaabd43a385c9f26297d3598792
    with:
      source_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml

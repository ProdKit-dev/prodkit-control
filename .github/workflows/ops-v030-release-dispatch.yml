name: Ops v0.3.0 Release Dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch exact v0.3.0 release
    if: ${{ github.head_ref == 'ops/v0.3.0-finalize' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    steps:
      - name: Dispatch only after exact proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = "34061e89321c111c55d2fdd8bb60e235fd25e47d"
          proof_id = 32640412462
          base = f"https://api.github.com/repos/{repo}/"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-v030-release-dispatch",
          }

          def api(method, path, payload=None):
              data = None
              h = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode()
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=120) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          main = api("GET", "commits/main")
          if main.get("sha") != target:
              raise SystemExit(f"main moved: {main.get('sha')}")

          proof = api("GET", f"actions/runs/{proof_id}")
          if (
              proof.get("head_sha") != target
              or proof.get("event") != "workflow_dispatch"
              or proof.get("path") != ".github/workflows/trusted-release-proof.yml"
              or proof.get("status") != "completed"
              or proof.get("conclusion") != "success"
          ):
              raise SystemExit("exact trusted release proof is not valid")

          query = urllib.parse.urlencode(
              {"event": "workflow_dispatch", "head_sha": target, "per_page": "100"}
          )
          runs = api("GET", f"actions/workflows/release.yml/runs?{query}").get("workflow_runs", [])
          exact = [r for r in runs if r.get("head_sha") == target and r.get("event") == "workflow_dispatch"]
          if exact:
              latest = max(exact, key=lambda r: r.get("id", 0))
              print(
                  f"EXACT_RELEASE_ALREADY_EXISTS id={latest.get('id')} status={latest.get('status')} conclusion={latest.get('conclusion')}",
                  flush=True,
              )
              raise SystemExit(0)

          api(
              "POST",
              "actions/workflows/release.yml/dispatches",
              {"ref": "main", "inputs": {"version": "0.3.0", "prerelease": "false"}},
          )
          print(f"EXACT_RELEASE_DISPATCHED target={target} proof={proof_id}", flush=True)
          PY

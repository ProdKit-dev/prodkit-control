name: One-shot canonical v0.0.0 renumber

on:
  push:
    branches:
      - docs/enterprise-architecture-baseline

permissions:
  contents: write

concurrency:
  group: renumber-v0.0.0
  cancel-in-progress: false

jobs:
  renumber:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.0"
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Renumber tracked source and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          output = subprocess.run(
              ["git", "grep", "-Il", "0\\.0\\.1", "--", "."],
              check=False,
              capture_output=True,
              text=True,
          )
          paths = [Path(line) for line in output.stdout.splitlines() if line.strip()]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              updated = text.replace("0.0.1", "0.0.0")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  print(path)

          old = Path("docs/releases/v0.0.1.md")
          new = Path("docs/releases/v0.0.0.md")
          if old.exists():
              if new.exists():
                  raise SystemExit(f"refusing to overwrite {new}")
              old.rename(new)
          PY

          test -f docs/releases/v0.0.0.md
          if git grep -n '0\.0\.1' -- .; then
            echo 'unexpected 0.0.1 reference remains' >&2
            exit 1
          fi

      - name: Regenerate lock metadata
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          pnpm install --lockfile-only

      - name: Verify v0.0.0 release contract
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-packages --group dev --locked
          pnpm install --frozen-lockfile
          uv run python scripts/release_check.py --version 0.0.0
          git diff --check

      - name: Commit renumber and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/renumber-v0.0.0.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          while IFS= read -r -d '' path; do
            git add -- "$path"
          done < <(git diff --name-only -z)
          git add -- docs/releases/v0.0.0.md

          git diff --cached --check
          git status --short
          git commit -m 'chore: renumber canonical foundation to v0.0.0'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Final v0.1.0 Branch Cleanup

on:
  push:
    branches: [ops/final-v0.1.0-cleanup]

permissions:
  actions: read
  contents: write

concurrency:
  group: final-v0.1.0-branch-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    name: verify exact-main gates and delete stale branches
    if: ${{ github.ref == 'refs/heads/ops/final-v0.1.0-cleanup' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Verify exact-main gates, delete stale refs, and self-clean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          EXPECTED_MAIN_SHA: ffa90af32655f61d623154ae507cd9377be9020d
          SELF_BRANCH: ops/final-v0.1.0-cleanup
        run: |
          set -euo pipefail

          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          get_code() {
            local url="$1"
            local output="$2"
            curl --silent --show-error --location "${auth[@]}" --output "$output" --write-out '%{http_code}' "$url"
          }

          verify_main() {
            local body code sha
            body="$(mktemp)"
            code="$(get_code "${API}/git/ref/heads/main" "$body")"
            if [[ "$code" != "200" ]]; then
              echo "main ref lookup returned HTTP $code" >&2
              cat "$body" >&2 || true
              exit 1
            fi
            sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["object"]["sha"])' "$body")"
            if [[ "$sha" != "$EXPECTED_MAIN_SHA" ]]; then
              echo "refusing cleanup: main moved from ${EXPECTED_MAIN_SHA} to ${sha}" >&2
              exit 1
            fi
          }

          verify_exact_main_gates() {
            local body code
            body="$(mktemp)"
            code="$(get_code "${API}/actions/runs?head_sha=${EXPECTED_MAIN_SHA}&event=push&per_page=100" "$body")"
            if [[ "$code" != "200" ]]; then
              echo "workflow-run lookup returned HTTP $code" >&2
              cat "$body" >&2 || true
              exit 1
            fi

            python3 - "$body" "$EXPECTED_MAIN_SHA" <<'PY'
          import json
          import sys

          path, expected_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])

          required = ("CI", "Security", "CodeQL")
          for name in required:
              candidates = [
                  run
                  for run in runs
                  if run.get("name") == name
                  and run.get("head_sha") == expected_sha
                  and run.get("event") == "push"
              ]
              if not candidates:
                  raise SystemExit(f"missing exact-main push run for {name} at {expected_sha}")
              latest = max(
                  candidates,
                  key=lambda run: (
                      int(run.get("run_number") or 0),
                      int(run.get("run_attempt") or 0),
                      run.get("created_at") or "",
                  ),
              )
              status = latest.get("status")
              conclusion = latest.get("conclusion")
              url = latest.get("html_url")
              print(f"{name}: status={status} conclusion={conclusion} url={url}")
              if status != "completed" or conclusion != "success":
                  raise SystemExit(
                      f"latest exact-main push run for {name} is not green: "
                      f"status={status} conclusion={conclusion}"
                  )
          PY
          }

          delete_branch() {
            local branch="$1"
            local body code delete_body delete_code verify_body verify_code
            body="$(mktemp)"
            code="$(get_code "${API}/git/ref/heads/${branch}" "$body")"
            case "$code" in
              200)
                delete_body="$(mktemp)"
                delete_code="$(curl --silent --show-error --location --request DELETE "${auth[@]}" --output "$delete_body" --write-out '%{http_code}' "${API}/git/refs/heads/${branch}")"
                if [[ "$delete_code" != "204" ]]; then
                  echo "DELETE ${branch} returned HTTP ${delete_code}" >&2
                  cat "$delete_body" >&2 || true
                  exit 1
                fi
                ;;
              404) ;;
              *)
                echo "lookup ${branch} returned HTTP ${code}" >&2
                cat "$body" >&2 || true
                exit 1
                ;;
            esac

            verify_body="$(mktemp)"
            verify_code="$(get_code "${API}/git/ref/heads/${branch}" "$verify_body")"
            if [[ "$verify_code" != "404" ]]; then
              echo "branch still exists after cleanup: ${branch} (HTTP ${verify_code})" >&2
              cat "$verify_body" >&2 || true
              exit 1
            fi
            echo "removed ${branch}"
          }

          verify_main
          verify_exact_main_gates

          stale_branches=(
            "chore/adopt-runner-failover"
            "ci/conditional-runner-policy"
            "fix/release-publisher-draft-recovery"
            "fix/security-node-audit-dev-deps"
            "maintenance/remove-v0.0.1"
            "milestone/v0.1.0-hardened-execution"
            "ops/dispatch-pr13-self-hosted"
            "ops/runner-disk-cleanup-20260821"
            "test/workflow-runner-canary"
          )

          for branch in "${stale_branches[@]}"; do
            delete_branch "$branch"
          done

          verify_main
          delete_branch "$SELF_BRANCH"

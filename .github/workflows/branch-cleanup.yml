name: Branch Cleanup

on:
  workflow_dispatch:
    inputs:
      branches_json:
        description: JSON array of explicit branch names to clean
        required: true
        type: string
      dry_run:
        description: Validate and report only
        required: true
        default: true
        type: boolean
      expected_default_sha:
        description: Optional exact default-branch SHA reviewed by an upstream gate
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: read
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-branch-cleanup.yml@89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc
    with:
      branches_json: ${{ inputs.branches_json }}
      expected_default_sha: ${{ inputs.expected_default_sha != '' && inputs.expected_default_sha || github.sha }}
      dry_run: ${{ inputs.dry_run }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}

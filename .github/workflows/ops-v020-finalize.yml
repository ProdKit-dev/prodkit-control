name: Ops v0.2.0 Finalize

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: write

jobs:
  finalize:
    name: Finalize v0.2.0
    if: ${{ github.head_ref == 'ops/v0.2.0-finalize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: "4242311699d73dc99bb2a834c8f4eb62bad1f299"
      VERSION: "0.2.0"
      OPERATOR_PR: "28"
      DEPLOYMENT_CUTOFF: "2026-08-21T23:10:00Z"
    steps:
      - name: Verify, prove, publish, verify, and clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          version = os.environ["VERSION"]
          tag = f"v{version}"
          operator_pr = int(os.environ["OPERATOR_PR"])
          deployment_cutoff = os.environ["DEPLOYMENT_CUTOFF"]
          base = f"https://api.github.com/repos/{repo}/"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-v020-finalizer",
          }

          if not re.fullmatch(r"[0-9a-f]{40}", target):
              raise SystemExit("TARGET_SHA must be an exact lowercase commit SHA")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("VERSION must be stable SemVer")

          def api(method: str, path: str, payload=None, *, accept=None, allow_404=False):
              h = dict(headers)
              if accept:
                  h["Accept"] = accept
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read()
                      if not raw:
                          return None
                      if accept == "application/octet-stream":
                          return raw
                      return json.loads(raw)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  if allow_404 and exc.code == 404:
                      return None
                  raise SystemExit(f"GitHub API {method} {path} failed: {exc.code} {body}") from exc

          def list_runs(*, workflow=None, event=None, sha=None):
              params = {"per_page": "100"}
              if event:
                  params["event"] = event
              if sha:
                  params["head_sha"] = sha
              query = urllib.parse.urlencode(params)
              if workflow:
                  wf = urllib.parse.quote(workflow, safe="")
                  data = api("GET", f"actions/workflows/{wf}/runs?{query}")
              else:
                  data = api("GET", f"actions/runs?{query}")
              return data.get("workflow_runs", [])

          def wait_push_gates():
              required = {
                  "CI": ".github/workflows/ci.yml",
                  "Security": ".github/workflows/security.yml",
                  "CodeQL": ".github/workflows/codeql.yml",
                  "Release Metadata": ".github/workflows/release-metadata.yml",
              }
              deadline = time.time() + 3600
              while time.time() < deadline:
                  runs = [
                      run for run in list_runs(event="push", sha=target)
                      if run.get("head_sha") == target and run.get("event") == "push"
                  ]
                  state = {}
                  failed = []
                  for name, path in required.items():
                      matches = [run for run in runs if run.get("name") == name and run.get("path") == path]
                      matches.sort(key=lambda x: x.get("id", 0), reverse=True)
                      if not matches:
                          state[name] = "missing"
                          continue
                      run = matches[0]
                      state[name] = f"{run.get('status')}/{run.get('conclusion')}#{run.get('id')}"
                      if run.get("status") == "completed" and run.get("conclusion") != "success":
                          failed.append((name, run.get("id"), run.get("conclusion"), run.get("html_url")))
                  print("exact-main gates:", state, flush=True)
                  if failed:
                      raise SystemExit(f"exact-main gate failure: {failed}")
                  if all(
                      any(
                          run.get("name") == name
                          and run.get("path") == path
                          and run.get("status") == "completed"
                          and run.get("conclusion") == "success"
                          for run in runs
                      )
                      for name, path in required.items()
                  ):
                      selected = {}
                      for name, path in required.items():
                          match = max(
                              run for run in runs
                              if run.get("name") == name
                              and run.get("path") == path
                              and run.get("status") == "completed"
                              and run.get("conclusion") == "success"
                          )
                          selected[name] = match.get("id")
                      print("EXACT_MAIN_GATES_OK", selected, flush=True)
                      return selected
                  time.sleep(10)
              raise SystemExit("timed out waiting for exact-main push gates")

          def wait_dispatched(workflow: str, before_ids: set[int], label: str, timeout=5400):
              deadline = time.time() + timeout
              while time.time() < deadline:
                  runs = [
                      run for run in list_runs(workflow=workflow, event="workflow_dispatch", sha=target)
                      if run.get("head_sha") == target
                      and run.get("event") == "workflow_dispatch"
                      and int(run.get("id", 0)) not in before_ids
                  ]
                  runs.sort(key=lambda x: x.get("id", 0), reverse=True)
                  if runs:
                      run = runs[0]
                      print(
                          f"{label}: id={run.get('id')} status={run.get('status')} conclusion={run.get('conclusion')} url={run.get('html_url')}",
                          flush=True,
                      )
                      if run.get("status") == "completed":
                          if run.get("conclusion") != "success":
                              raise SystemExit(
                                  f"{label} failed: run={run.get('id')} conclusion={run.get('conclusion')} url={run.get('html_url')}"
                              )
                          return run
                  time.sleep(10)
              raise SystemExit(f"timed out waiting for {label}")

          main = api("GET", "commits/main")
          actual_main = main.get("sha")
          if actual_main != target:
              raise SystemExit(f"main moved: expected {target}, actual {actual_main}")
          print(f"EXACT_MAIN_OK {target}", flush=True)

          gate_ids = wait_push_gates()

          proof_file = "trusted-release-proof.yml"
          existing_proofs = {
              int(run.get("id", 0))
              for run in list_runs(workflow=proof_file, event="workflow_dispatch", sha=target)
          }
          already_green_proofs = [
              run for run in list_runs(workflow=proof_file, event="workflow_dispatch", sha=target)
              if run.get("head_sha") == target
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if already_green_proofs:
              proof = max(already_green_proofs, key=lambda x: x.get("id", 0))
              print(f"REUSING_EXACT_PROOF {proof.get('id')} {proof.get('html_url')}", flush=True)
          else:
              api("POST", f"actions/workflows/{proof_file}/dispatches", {"ref": "main"})
              proof = wait_dispatched(proof_file, existing_proofs, "Trusted Release Proof")
          print(f"TRUSTED_RELEASE_PROOF_OK {proof.get('id')}", flush=True)

          release_file = "release.yml"
          before_release = {
              int(run.get("id", 0))
              for run in list_runs(workflow=release_file, event="workflow_dispatch", sha=target)
          }
          api(
              "POST",
              f"actions/workflows/{release_file}/dispatches",
              {"ref": "main", "inputs": {"version": version, "prerelease": "false"}},
          )
          release_run = wait_dispatched(release_file, before_release, "Release")
          print(f"RELEASE_WORKFLOW_OK {release_run.get('id')}", flush=True)

          def resolve_tag_sha(tag_name: str):
              qtag = urllib.parse.quote(tag_name, safe="")
              ref = api("GET", f"git/ref/tags/{qtag}")
              obj = ref.get("object", {})
              seen = set()
              while obj.get("type") == "tag":
                  sha = obj.get("sha")
                  if not sha or sha in seen:
                      raise SystemExit("invalid/cyclic annotated tag")
                  seen.add(sha)
                  obj = api("GET", f"git/tags/{sha}").get("object", {})
              if obj.get("type") != "commit":
                  raise SystemExit(f"tag does not resolve to a commit: {obj}")
              return obj.get("sha")

          tag_sha = resolve_tag_sha(tag)
          if tag_sha != target:
              raise SystemExit(f"immutable tag mismatch: {tag} -> {tag_sha}, expected {target}")
          print(f"IMMUTABLE_TAG_OK {tag} {tag_sha}", flush=True)

          qtag = urllib.parse.quote(tag, safe="")
          release = api("GET", f"releases/tags/{qtag}")
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("published release is draft or prerelease")
          if release.get("tag_name") != tag:
              raise SystemExit("published release tag mismatch")
          release_id = int(release["id"])
          assets = api("GET", f"releases/{release_id}/assets?per_page=100")
          by_name = {asset["name"]: asset for asset in assets}
          if len(by_name) != len(assets):
              raise SystemExit("duplicate release asset names")
          if "SHA256SUMS" not in by_name:
              raise SystemExit("release is missing SHA256SUMS")
          if not any(name.endswith(".spdx.json") for name in by_name):
              raise SystemExit("release is missing SPDX SBOM asset")

          sums_raw = api(
              "GET",
              f"releases/assets/{by_name['SHA256SUMS']['id']}",
              accept="application/octet-stream",
          )
          expected = {}
          for raw_line in sums_raw.decode("utf-8").splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              parts = line.split(None, 1)
              if len(parts) != 2 or not re.fullmatch(r"[0-9a-f]{64}", parts[0]):
                  raise SystemExit(f"invalid SHA256SUMS line: {raw_line!r}")
              name = parts[1].lstrip("*")
              if name in expected:
                  raise SystemExit(f"duplicate SHA256SUMS entry: {name}")
              expected[name] = parts[0]
          remote_payloads = set(by_name) - {"SHA256SUMS"}
          if set(expected) != remote_payloads:
              raise SystemExit(
                  f"published asset/checksum set mismatch: assets={sorted(remote_payloads)} sums={sorted(expected)}"
              )
          for name in sorted(remote_payloads):
              asset = by_name[name]
              raw = api(
                  "GET",
                  f"releases/assets/{asset['id']}",
                  accept="application/octet-stream",
              )
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected[name]:
                  raise SystemExit(f"published checksum mismatch: {name}")
              github_digest = asset.get("digest")
              if github_digest and github_digest != f"sha256:{digest}":
                  raise SystemExit(f"GitHub asset digest mismatch: {name}")
          print(
              f"PUBLISHED_ASSETS_OK release_id={release_id} count={len(assets)} url={release.get('html_url')}",
              flush=True,
          )

          deployments = api("GET", "deployments?environment=release&per_page=100")
          unexpected = [
              dep for dep in deployments
              if str(dep.get("created_at", "")) >= deployment_cutoff
          ]
          if unexpected:
              raise SystemExit(
                  "unexpected post-fix release deployment records: "
                  + json.dumps(
                      [
                          {"id": d.get("id"), "sha": d.get("sha"), "created_at": d.get("created_at")}
                          for d in unexpected
                      ],
                      sort_keys=True,
                  )
              )
          removed_deployments = []
          for dep in deployments:
              dep_id = int(dep["id"])
              api(
                  "POST",
                  f"deployments/{dep_id}/statuses",
                  {
                      "state": "inactive",
                      "environment": "release",
                      "description": "Retire historical release-control deployment record",
                  },
              )
              api("DELETE", f"deployments/{dep_id}")
              removed_deployments.append(dep_id)
          print(f"RELEASE_DEPLOYMENT_CLEANUP_OK removed={removed_deployments}", flush=True)

          stale_branches = [
              "feat/v0.2.0-delivery-chain-reconciliation",
              "fix/v0.2.0-release-deadlock",
              "ops/v0.2.0-bootstrap-base",
          ]
          removed_branches = []
          for branch in stale_branches:
              ref_path = "git/refs/" + urllib.parse.quote(f"heads/{branch}", safe="/")
              existing = api("GET", ref_path, allow_404=True)
              if existing is None:
                  continue
              api("DELETE", ref_path)
              removed_branches.append(branch)
          print(f"CONTROL_BRANCH_CLEANUP_OK removed={removed_branches}", flush=True)

          summary = {
              "target_sha": target,
              "version": version,
              "gate_run_ids": gate_ids,
              "proof_run_id": proof.get("id"),
              "release_run_id": release_run.get("id"),
              "release_id": release_id,
              "tag_sha": tag_sha,
              "asset_count": len(assets),
              "removed_deployments": removed_deployments,
              "removed_branches": removed_branches,
          }
          print("V0_2_0_RELEASE_VERIFIED " + json.dumps(summary, sort_keys=True), flush=True)
          PY

name: Ops v0.2.0 Finalize

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: write

jobs:
  finalize:
    name: Finalize v0.2.0
    if: ${{ github.head_ref == 'ops/v0.2.0-finalize' }}
    runs-on: ${{ fromJSON(vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: "4242311699d73dc99bb2a834c8f4eb62bad1f299"
      VERSION: "0.2.0"
      OPERATOR_PR: "28"
      DEPLOYMENT_CUTOFF: "2026-08-21T23:10:00Z"
    steps:
      - name: Advance single-runner-safe release state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          version = os.environ["VERSION"]
          tag = f"v{version}"
          operator_pr = int(os.environ["OPERATOR_PR"])
          deployment_cutoff = os.environ["DEPLOYMENT_CUTOFF"]
          base = f"https://api.github.com/repos/{repo}/"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-v020-finalizer",
          }

          if not re.fullmatch(r"[0-9a-f]{40}", target):
              raise SystemExit("TARGET_SHA must be an exact lowercase commit SHA")

          def api(method: str, path: str, payload=None, *, accept=None, allow_404=False):
              h = dict(headers)
              if accept:
                  h["Accept"] = accept
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read()
                      if not raw:
                          return None
                      if accept == "application/octet-stream":
                          return raw
                      return json.loads(raw)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  if allow_404 and exc.code == 404:
                      return None
                  raise SystemExit(f"GitHub API {method} {path} failed: {exc.code} {body}") from exc

          def list_runs(*, workflow=None, event=None, sha=None):
              params = {"per_page": "100"}
              if event:
                  params["event"] = event
              if sha:
                  params["head_sha"] = sha
              query = urllib.parse.urlencode(params)
              if workflow:
                  wf = urllib.parse.quote(workflow, safe="")
                  data = api("GET", f"actions/workflows/{wf}/runs?{query}")
              else:
                  data = api("GET", f"actions/runs?{query}")
              return data.get("workflow_runs", [])

          def latest_exact(workflow: str):
              rows = [
                  run for run in list_runs(workflow=workflow, event="workflow_dispatch", sha=target)
                  if run.get("head_sha") == target and run.get("event") == "workflow_dispatch"
              ]
              return max(rows, key=lambda x: x.get("id", 0)) if rows else None

          main = api("GET", "commits/main")
          if main.get("sha") != target:
              raise SystemExit(f"main moved: expected {target}, actual {main.get('sha')}")
          print(f"EXACT_MAIN_OK {target}", flush=True)

          required = {
              "CI": ".github/workflows/ci.yml",
              "Security": ".github/workflows/security.yml",
              "CodeQL": ".github/workflows/codeql.yml",
              "Release Metadata": ".github/workflows/release-metadata.yml",
          }
          push_runs = [
              run for run in list_runs(event="push", sha=target)
              if run.get("head_sha") == target and run.get("event") == "push"
          ]
          gate_ids = {}
          pending = {}
          for name, path in required.items():
              matches = [run for run in push_runs if run.get("name") == name and run.get("path") == path]
              matches.sort(key=lambda x: x.get("id", 0), reverse=True)
              if not matches:
                  pending[name] = "missing"
                  continue
              run = matches[0]
              if run.get("status") == "completed" and run.get("conclusion") == "success":
                  gate_ids[name] = run.get("id")
              elif run.get("status") == "completed":
                  raise SystemExit(
                      f"exact-main gate failed: {name} run={run.get('id')} conclusion={run.get('conclusion')} url={run.get('html_url')}"
                  )
              else:
                  pending[name] = f"{run.get('status')}#{run.get('id')}"
          if pending:
              print("STATE_MAIN_GATES_PENDING " + json.dumps(pending, sort_keys=True), flush=True)
              raise SystemExit(0)
          print("EXACT_MAIN_GATES_OK " + json.dumps(gate_ids, sort_keys=True), flush=True)

          proof_file = "trusted-release-proof.yml"
          proof = latest_exact(proof_file)
          if proof is None:
              before = {int(r.get("id", 0)) for r in list_runs(workflow=proof_file, event="workflow_dispatch", sha=target)}
              api("POST", f"actions/workflows/{proof_file}/dispatches", {"ref": "main"})
              dispatched = None
              for _ in range(15):
                  time.sleep(1)
                  candidates = [
                      r for r in list_runs(workflow=proof_file, event="workflow_dispatch", sha=target)
                      if r.get("head_sha") == target and int(r.get("id", 0)) not in before
                  ]
                  if candidates:
                      dispatched = max(candidates, key=lambda x: x.get("id", 0))
                      break
              print(
                  f"STATE_PROOF_DISPATCHED id={dispatched.get('id') if dispatched else 'discover-later'} url={dispatched.get('html_url') if dispatched else ''}",
                  flush=True,
              )
              raise SystemExit(0)
          if proof.get("status") != "completed":
              print(f"STATE_PROOF_PENDING id={proof.get('id')} status={proof.get('status')}", flush=True)
              raise SystemExit(0)
          if proof.get("conclusion") != "success":
              raise SystemExit(
                  f"Trusted Release Proof failed: run={proof.get('id')} conclusion={proof.get('conclusion')} url={proof.get('html_url')}"
              )
          print(f"TRUSTED_RELEASE_PROOF_OK {proof.get('id')} {proof.get('html_url')}", flush=True)

          release_file = "release.yml"
          release_run = latest_exact(release_file)
          if release_run is None:
              before = {int(r.get("id", 0)) for r in list_runs(workflow=release_file, event="workflow_dispatch", sha=target)}
              api(
                  "POST",
                  f"actions/workflows/{release_file}/dispatches",
                  {"ref": "main", "inputs": {"version": version, "prerelease": "false"}},
              )
              dispatched = None
              for _ in range(15):
                  time.sleep(1)
                  candidates = [
                      r for r in list_runs(workflow=release_file, event="workflow_dispatch", sha=target)
                      if r.get("head_sha") == target and int(r.get("id", 0)) not in before
                  ]
                  if candidates:
                      dispatched = max(candidates, key=lambda x: x.get("id", 0))
                      break
              print(
                  f"STATE_RELEASE_DISPATCHED id={dispatched.get('id') if dispatched else 'discover-later'} url={dispatched.get('html_url') if dispatched else ''}",
                  flush=True,
              )
              raise SystemExit(0)
          if release_run.get("status") != "completed":
              print(f"STATE_RELEASE_PENDING id={release_run.get('id')} status={release_run.get('status')}", flush=True)
              raise SystemExit(0)
          if release_run.get("conclusion") != "success":
              raise SystemExit(
                  f"Release failed: run={release_run.get('id')} conclusion={release_run.get('conclusion')} url={release_run.get('html_url')}"
              )
          print(f"RELEASE_WORKFLOW_OK {release_run.get('id')} {release_run.get('html_url')}", flush=True)

          def resolve_tag_sha(tag_name: str):
              qtag = urllib.parse.quote(tag_name, safe="")
              ref = api("GET", f"git/ref/tags/{qtag}")
              obj = ref.get("object", {})
              seen = set()
              while obj.get("type") == "tag":
                  sha = obj.get("sha")
                  if not sha or sha in seen:
                      raise SystemExit("invalid/cyclic annotated tag")
                  seen.add(sha)
                  obj = api("GET", f"git/tags/{sha}").get("object", {})
              if obj.get("type") != "commit":
                  raise SystemExit(f"tag does not resolve to commit: {obj}")
              return obj.get("sha")

          tag_sha = resolve_tag_sha(tag)
          if tag_sha != target:
              raise SystemExit(f"immutable tag mismatch: {tag} -> {tag_sha}, expected {target}")
          print(f"IMMUTABLE_TAG_OK {tag} {tag_sha}", flush=True)

          qtag = urllib.parse.quote(tag, safe="")
          release = api("GET", f"releases/tags/{qtag}")
          if release.get("draft") or release.get("prerelease") or release.get("tag_name") != tag:
              raise SystemExit("GitHub Release state/tag is invalid")
          release_id = int(release["id"])
          assets = api("GET", f"releases/{release_id}/assets?per_page=100")
          by_name = {asset["name"]: asset for asset in assets}
          if len(by_name) != len(assets):
              raise SystemExit("duplicate release asset names")
          if "SHA256SUMS" not in by_name:
              raise SystemExit("release missing SHA256SUMS")
          if not any(name.endswith(".spdx.json") for name in by_name):
              raise SystemExit("release missing SPDX SBOM")

          sums_raw = api("GET", f"releases/assets/{by_name['SHA256SUMS']['id']}", accept="application/octet-stream")
          expected = {}
          for raw_line in sums_raw.decode("utf-8").splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              parts = line.split(None, 1)
              if len(parts) != 2 or not re.fullmatch(r"[0-9a-f]{64}", parts[0]):
                  raise SystemExit(f"invalid SHA256SUMS line: {raw_line!r}")
              name = parts[1].lstrip("*")
              if name in expected:
                  raise SystemExit(f"duplicate SHA256SUMS entry: {name}")
              expected[name] = parts[0]
          payload_names = set(by_name) - {"SHA256SUMS"}
          if set(expected) != payload_names:
              raise SystemExit(
                  f"published asset/checksum set mismatch: assets={sorted(payload_names)} sums={sorted(expected)}"
              )
          for name in sorted(payload_names):
              asset = by_name[name]
              raw = api("GET", f"releases/assets/{asset['id']}", accept="application/octet-stream")
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected[name]:
                  raise SystemExit(f"published checksum mismatch: {name}")
              github_digest = asset.get("digest")
              if github_digest and github_digest != f"sha256:{digest}":
                  raise SystemExit(f"GitHub asset digest mismatch: {name}")
          print(f"PUBLISHED_ASSETS_OK release_id={release_id} count={len(assets)} url={release.get('html_url')}", flush=True)

          deployments = api("GET", "deployments?environment=release&per_page=100")
          unexpected = [dep for dep in deployments if str(dep.get("created_at", "")) >= deployment_cutoff]
          if unexpected:
              raise SystemExit(
                  "unexpected post-fix release deployment records: "
                  + json.dumps(
                      [{"id": d.get("id"), "sha": d.get("sha"), "created_at": d.get("created_at")} for d in unexpected],
                      sort_keys=True,
                  )
              )
          removed_deployments = []
          for dep in deployments:
              dep_id = int(dep["id"])
              api(
                  "POST",
                  f"deployments/{dep_id}/statuses",
                  {"state": "inactive", "environment": "release", "description": "Retire historical release-control deployment record"},
              )
              api("DELETE", f"deployments/{dep_id}")
              removed_deployments.append(dep_id)
          print(f"RELEASE_DEPLOYMENT_CLEANUP_OK removed={removed_deployments}", flush=True)

          stale_branches = [
              "feat/v0.2.0-delivery-chain-reconciliation",
              "fix/v0.2.0-release-deadlock",
              "ops/v0.2.0-bootstrap-base",
          ]
          removed_branches = []
          for branch in stale_branches:
              ref_path = "git/refs/" + urllib.parse.quote(f"heads/{branch}", safe="/")
              if api("GET", ref_path, allow_404=True) is None:
                  continue
              api("DELETE", ref_path)
              removed_branches.append(branch)
          print(f"CONTROL_BRANCH_CLEANUP_OK removed={removed_branches}", flush=True)

          summary = {
              "target_sha": target,
              "version": version,
              "gate_run_ids": gate_ids,
              "proof_run_id": proof.get("id"),
              "release_run_id": release_run.get("id"),
              "release_id": release_id,
              "tag_sha": tag_sha,
              "asset_count": len(assets),
              "removed_deployments": removed_deployments,
              "removed_branches": removed_branches,
          }
          print("V0_2_0_RELEASE_VERIFIED " + json.dumps(summary, sort_keys=True), flush=True)
          PY

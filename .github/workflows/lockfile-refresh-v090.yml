name: v0.9 Lockfile Refresh

on:
  push:
    branches:
      - release/v0.9.0-cumulative-completeness

permissions:
  contents: write

concurrency:
  group: v0.9-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.9.0-cumulative-completeness
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.0
          enable-cache: false
      - name: Regenerate only uv.lock
        run: |
          set -euo pipefail
          uv lock
          uv lock --check
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          changed="$(git diff --name-only)"
          if [[ "$changed" != "uv.lock" ]]; then
            echo "lock refresh changed unexpected paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git diff --check -- uv.lock
          git config user.name "prodkit-lock-bot"
          git config user.email "prodkit-lock-bot@users.noreply.github.com"
          git add -- uv.lock
          git commit -m "build: refresh v0.9 uv lock"
          git push origin HEAD:release/v0.9.0-cumulative-completeness

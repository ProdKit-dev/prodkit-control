name: Format v0.1.0 candidate

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v0.1.0'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.1.0
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.0
          enable-cache: true
      - name: Format Python sources
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.13
          uv sync --all-packages --python 3.13
          uv run ruff format .
          uv run ruff format --check .
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Candidate already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            packages/python/executors/prodkit-executor-filesystem/src/prodkit_executor_filesystem/executor.py \
            packages/python/executors/prodkit-executor-git/src/prodkit_executor_git/executor.py \
            packages/python/executors/prodkit-executor-github/src/prodkit_executor_github/executor.py \
            packages/python/executors/prodkit-executor-http/src/prodkit_executor_http/executor.py \
            packages/python/prodkit-control-postgres/src/prodkit_control_postgres/execution.py \
            packages/python/prodkit-control-postgres/src/prodkit_control_postgres/runs.py \
            packages/python/prodkit-control-runtime/src/prodkit_control_runtime/approvals.py \
            packages/python/prodkit-control-runtime/src/prodkit_control_runtime/artifacts.py \
            packages/python/prodkit-control-runtime/src/prodkit_control_runtime/broker.py \
            packages/python/prodkit-control-runtime/src/prodkit_control_runtime/credentials.py \
            scripts/set_release_version.py
          git diff --cached --check
          git commit -m "style: format v0.1.0 candidate"
          git push origin HEAD:release/v0.1.0

name: v0.9.1 Python Packaging Metadata Fix

on:
  push:
    branches:
      - release/v0.9.1-public-readiness
    paths:
      - .github/workflows/v0.9.1-python-packaging-fix.yml

permissions:
  contents: write

jobs:
  fix:
    name: Repair Python SPDX packaging metadata
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.0"

      - name: Repair generator and generated metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib

          generator = Path("scripts/prepare_public_metadata.py")
          text = generator.read_text(encoding="utf-8")
          old = '        "license": \'license = { text = "Apache-2.0" }\','
          new = '        "license": \'license = "Apache-2.0"\','
          if text.count(old) != 1:
              raise SystemExit("prepare_public_metadata.py license template was not found exactly once")
          generator.write_text(text.replace(old, new, 1), encoding="utf-8")

          checker = Path("scripts/check_public_readiness.py")
          text = checker.read_text(encoding="utf-8")
          old_helper = (
              'def _is_apache_license(value: object) -> bool:\n'
              '    if value == "Apache-2.0":\n'
              '        return True\n'
              '    return isinstance(value, dict) and value.get("text") == "Apache-2.0"\n'
          )
          new_helper = (
              'def _is_apache_license(value: object) -> bool:\n'
              '    return value == "Apache-2.0"\n'
          )
          if text.count(old_helper) != 1:
              raise SystemExit("check_public_readiness.py Apache license helper was not found exactly once")
          checker.write_text(text.replace(old_helper, new_helper, 1), encoding="utf-8")
          PY

          python scripts/prepare_public_metadata.py
          uv lock

          python - <<'PY'
          from pathlib import Path
          import tomllib

          paths = [Path("pyproject.toml"), *sorted(Path("packages/python").glob("**/pyproject.toml"))]
          for path in paths:
              payload = tomllib.loads(path.read_text(encoding="utf-8"))
              project = payload.get("project")
              if not isinstance(project, dict):
                  raise SystemExit(f"{path}: missing [project]")
              if project.get("license") != "Apache-2.0":
                  raise SystemExit(f"{path}: license must be SPDX string Apache-2.0")
              if project.get("license-files") != ["LICENSE", "NOTICE"]:
                  raise SystemExit(f"{path}: license-files must be LICENSE and NOTICE")
          print(f"validated SPDX packaging metadata for {len(paths)} Python projects")
          PY

          python scripts/release_check.py --version 0.9.1
          python scripts/check_package_completeness.py
          python scripts/check_public_readiness.py
          git diff --check

      - name: Commit permanent correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              pyproject.toml|uv.lock|scripts/prepare_public_metadata.py|scripts/check_public_readiness.py|packages/python/*/pyproject.toml|packages/python/*/*/pyproject.toml) ;;
              *) echo "unexpected packaging-fix mutation: $path" >&2; exit 2 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed[@]}"
          git rm -- .github/workflows/v0.9.1-python-packaging-fix.yml
          git commit -m "fix(packaging): use SPDX license expressions"
          git push origin HEAD:release/v0.9.1-public-readiness

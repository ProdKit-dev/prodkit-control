name: Release Metadata

on:
  push:
    branches: [main]
    paths:
      - ".prodkit/release.json"
      - "CHANGELOG.md"
      - "docs/releases/v*.md"
      - "docs/releases/README.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-metadata.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Optional published SemVer without v prefix; leave blank to use workspace version
        required: false
        type: string
        default: ""
      source_sha:
        description: Optional immutable tagged source SHA; required when version is supplied
        required: false
        type: string
        default: ""
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]

permissions:
  contents: write

concurrency:
  group: release-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner:
    name: runner
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-runner-policy.yml@877aefdeaa2084b47f4867dc6c7b0dfe6525fb2c
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'policy' }}
      fork_safe: false

  metadata:
    name: metadata
    needs: runner
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-metadata-current.yml@877aefdeaa2084b47f4867dc6c7b0dfe6525fb2c
    with:
      runner_json: ${{ needs.runner.outputs.runner_json }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      source_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
      normalize_all_titles: false
      environment: release

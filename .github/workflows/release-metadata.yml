name: Release Metadata

on:
  push:
    branches: [main]
    paths:
      - ".prodkit/release.json"
      - "CHANGELOG.md"
      - "docs/releases/v*.md"
      - "docs/releases/README.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-metadata.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Optional published SemVer without v prefix; leave blank to use workspace version
        required: false
        type: string
        default: ""
      source_sha:
        description: Optional immutable tagged source SHA; required when version is supplied
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: metadata
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-metadata-current.yml@e77861d685e0aaaabd43a385c9f26297d3598792
    with:
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      source_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
      normalize_all_titles: false
      normalize_all_releases: ${{ github.event_name == 'push' }}
      environment: release

name: Control State Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  inspect:
    if: ${{ github.event.pull_request.head.ref == 'ops/state-diagnostic' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: ffa90af32655f61d623154ae507cd9377be9020d
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect exact-main runs and release deployments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED_MAIN_SHA"]
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-state-diagnostic",
          }

          def get(path):
              req = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          main_sha = get("/git/ref/heads/main")["object"]["sha"]
          print(f"MAIN_SHA={main_sha}")
          if main_sha != expected:
              raise SystemExit(f"main moved: expected {expected}, got {main_sha}")

          q = urllib.parse.urlencode({"head_sha": expected, "per_page": 100})
          runs = get(f"/actions/runs?{q}").get("workflow_runs", [])
          print("EXACT_MAIN_RUNS_BEGIN")
          for run in sorted(runs, key=lambda x: int(x["id"]), reverse=True):
              print(json.dumps({
                  "id": run.get("id"),
                  "name": run.get("name"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "path": run.get("path"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "html_url": run.get("html_url"),
              }, sort_keys=True))
          print("EXACT_MAIN_RUNS_END")

          deployments = []
          page = 1
          while True:
              params = urllib.parse.urlencode({"environment": "release", "per_page": 100, "page": page})
              batch = get(f"/deployments?{params}")
              deployments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          print("RELEASE_DEPLOYMENTS_BEGIN")
          for dep in sorted(deployments, key=lambda x: int(x["id"]), reverse=True):
              statuses = get(f"/deployments/{dep['id']}/statuses?per_page=100")
              latest = statuses[0] if statuses else {}
              print(json.dumps({
                  "id": dep.get("id"),
                  "sha": dep.get("sha"),
                  "ref": dep.get("ref"),
                  "task": dep.get("task"),
                  "created_at": dep.get("created_at"),
                  "updated_at": dep.get("updated_at"),
                  "latest_state": latest.get("state"),
                  "latest_status_id": latest.get("id"),
                  "latest_created_at": latest.get("created_at"),
                  "log_url": latest.get("log_url"),
                  "environment_url": latest.get("environment_url"),
                  "status_count": len(statuses),
              }, sort_keys=True))
          print("RELEASE_DEPLOYMENTS_END")
          PY

name: Apply ProdKit Workflows v0.1.5

on:
  push:
    branches: [chore/workflows-v0.1.5-lifecycle]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply immutable lifecycle callers and pins
        shell: bash
        env:
          PIN: d117932d61e0bc45ec065dfc13728b71c6ceb9f3
          BRANCH: chore/workflows-v0.1.5-lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request

          pin = "d117932d61e0bc45ec065dfc13728b71c6ceb9f3"
          raw = f"https://raw.githubusercontent.com/ProdKit-dev/prodkit-workflows/{pin}/templates/caller"
          files = [
              "branch-cleanup.yml",
              "post-gate-branch-cleanup.yml",
              "release-proof-dispatch.yml",
              "release-promotion.yml",
              "release-verification.yml",
          ]
          wf = Path(".github/workflows")
          wf.mkdir(parents=True, exist_ok=True)
          has_codeql = (wf / "codeql.yml").is_file()
          gates = '["CI","Security","CodeQL"]' if has_codeql else '["CI","Security"]'
          workflow_names = '["CI", "Security", "CodeQL"]' if has_codeql else '["CI", "Security"]'
          for name in files:
              text = urllib.request.urlopen(f"{raw}/{name}", timeout=60).read().decode()
              text = text.replace("WORKFLOWS_REPOSITORY", "ProdKit-dev/prodkit-workflows")
              text = text.replace("REPLACE_WITH_PRODKIT_WORKFLOWS_SHA", pin)
              if name == "release-proof-dispatch.yml":
                  text = text.replace('workflows: ["CI", "Security"]', f"workflows: {workflow_names}")
                  text = text.replace("required_workflows_json: '[\"CI\",\"Security\"]'", f"required_workflows_json: '{gates}'")
              (wf / name).write_text(text, encoding="utf-8")

          central_ref = re.compile(r"(ProdKit-dev/prodkit-workflows/\.github/workflows/[^@\s]+@)[0-9a-f]{40}")
          for path in wf.glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              text = central_ref.sub(rf"\g<1>{pin}", text)
              if path.name in {"trusted-release-proof.yml", "release.yml"}:
                  text = re.sub(
                      r"required_workflows_json:\s*'\[[^\n]*\]'",
                      f"required_workflows_json: '{gates}'",
                      text,
                  )
              path.write_text(text, encoding="utf-8")

          known = (
              "89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc",
              "237d54ed3e9ffe6baa58196aa13cfa1b610298aa",
              "1ed882908e5ff0fe6f61662ec924551137c60257",
              "a0c292ee6a276a3f9b05470e58c4d5f3ed2130e7",
          )
          for root in (Path("scripts"),):
              if not root.is_dir():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if any(old in text for old in known):
                      for old in known:
                          text = text.replace(old, pin)
                      path.write_text(text, encoding="utf-8")

          proof_dispatch = (wf / "release-proof-dispatch.yml").read_text()
          verification = (wf / "release-verification.yml").read_text()
          promotion = (wf / "release-promotion.yml").read_text()
          assert f"required_workflows_json: '{gates}'" in proof_dispatch
          assert "automatic_cleanup: true" in verification
          assert "actions: write" in verification and "pull-requests: read" in verification
          assert "contents: write" not in verification
          assert "workflow_dispatch:" in promotion and "proof_run_id:" in promotion
          for path in wf.glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              for match in central_ref.finditer(text):
                  assert text[match.end()-40:match.end()] == pin
          PY

          git rm -- .github/workflows/apply-lifecycle-v015.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows scripts
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "chore(workflows): align automatic lifecycle to v0.1.5"
          git push origin "HEAD:${BRANCH}"

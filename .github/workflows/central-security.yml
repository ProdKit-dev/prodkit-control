name: Central Security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner target
        required: true
        type: choice
        default: github-hosted
        options: [github-hosted, self-hosted]

permissions:
  contents: read

concurrency:
  group: central-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-security.yml@3b8adbb377f02eea0ef7e41a7dfcdfb4b45dfe7f
    with:
      runner_json: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      secret_scan_enabled: true
      gitleaks_config_path: .gitleaks.toml
      sbom_enabled: true
      python_enabled: true
      python_script: .prodkit/workflows/security-python.sh
      node_enabled: true
      node_script: .prodkit/workflows/security-node.sh
      container_enabled: false
      custom_enabled: false

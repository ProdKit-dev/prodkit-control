name: v0.6.1 Governance Safety Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'hotfix/v0.6.1-governance-safety' }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.0
          enable-cache: false
      - name: Apply and validate safety corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v061_governance_safety.py
          uv python install 3.13
          uv sync --all-packages --group dev --locked --python 3.13
          uv run --python 3.13 --no-sync ruff format \
            packages/python/prodkit-control-core/src/prodkit_control_core/contracts/governance.py \
            packages/python/prodkit-control-core/src/prodkit_control_core/contracts/transfers.py \
            packages/python/prodkit-control-runtime/src/prodkit_control_runtime/governance.py \
            packages/python/prodkit-control-postgres/src/prodkit_control_postgres/governance.py \
            tests/test_governance.py scripts/ci_governance_postgres.py
          uv run --python 3.13 --no-sync ruff check --fix \
            packages/python/prodkit-control-core/src/prodkit_control_core/contracts/governance.py \
            packages/python/prodkit-control-core/src/prodkit_control_core/contracts/transfers.py \
            packages/python/prodkit-control-runtime/src/prodkit_control_runtime/governance.py \
            packages/python/prodkit-control-postgres/src/prodkit_control_postgres/governance.py \
            tests/test_governance.py scripts/ci_governance_postgres.py
          uv run --python 3.13 --no-sync pytest -q tests/test_governance.py
          rm -f scripts/apply_v061_governance_safety.py .github/workflows/v061-hotfix-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            packages/python/prodkit-control-core/src/prodkit_control_core/contracts/governance.py \
            packages/python/prodkit-control-core/src/prodkit_control_core/contracts/transfers.py \
            packages/python/prodkit-control-runtime/src/prodkit_control_runtime/governance.py \
            packages/python/prodkit-control-postgres/src/prodkit_control_postgres/governance.py \
            packages/typescript/control/src/index.ts \
            tests/test_governance.py scripts/ci_governance_postgres.py \
            scripts/apply_v061_governance_safety.py .github/workflows/v061-hotfix-apply.yml
          git diff --cached --check
          git commit -m 'fix: close v0.6 governance safety gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

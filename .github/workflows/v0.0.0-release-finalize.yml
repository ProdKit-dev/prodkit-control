name: Close canonical v0.0.0 release cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finalize-v0.0.0
  cancel-in-progress: true

jobs:
  close:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Verify final release state and remove temporary branches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_sha = "a43a33e9d9ab52c5447bf623eaf919d70f50d728"
          release_id = 373886184
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-release-cleanup",
          }

          def api(method: str, path: str, *, allow_404: bool = False):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  detail = exc.read().decode(errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {exc.code}: {detail}") from exc

          def ref(kind: str, name: str):
              encoded = urllib.parse.quote(name, safe="")
              return api("GET", f"/repos/{repo}/git/ref/{kind}/{encoded}", allow_404=True)

          def delete_branch(name: str):
              encoded = urllib.parse.quote(name, safe="")
              api("DELETE", f"/repos/{repo}/git/refs/heads/{encoded}")

          new_tag = ref("tags", "v0.0.0")
          if not isinstance(new_tag, dict) or not isinstance(new_tag.get("object"), dict):
              raise RuntimeError("v0.0.0 tag missing")
          if new_tag["object"].get("sha") != expected_sha:
              raise RuntimeError("v0.0.0 tag target mismatch")

          release = api("GET", f"/repos/{repo}/releases/tags/v0.0.0")
          if not isinstance(release, dict):
              raise RuntimeError("v0.0.0 release missing")
          if release.get("id") != release_id:
              raise RuntimeError("v0.0.0 release id changed")
          if release.get("name") != "ProdKit Control v0.0.0":
              raise RuntimeError("v0.0.0 release title mismatch")
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise RuntimeError("v0.0.0 release state mismatch")
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != 69:
              raise RuntimeError("v0.0.0 release asset count mismatch")
          if any(not isinstance(a, dict) or not str(a.get("digest", "")).startswith("sha256:") for a in assets):
              raise RuntimeError("v0.0.0 asset digest metadata incomplete")

          releases = api("GET", f"/repos/{repo}/releases?per_page=100")
          if not isinstance(releases, list):
              raise RuntimeError("cannot list releases")
          if any(isinstance(r, dict) and r.get("tag_name") == "v0.0.1" for r in releases):
              raise RuntimeError("provisional v0.0.1 release still exists")

          old_tag = ref("tags", "v0.0.1")
          if old_tag is None:
              raise RuntimeError("expected immutable historical v0.0.1 tag is unexpectedly absent")

          rulesets = api("GET", f"/repos/{repo}/rulesets?includes_parents=true&per_page=100")
          if not isinstance(rulesets, list):
              raise RuntimeError("cannot read effective rulesets")
          tag_rule = next(
              (
                  r for r in rulesets
                  if isinstance(r, dict)
                  and r.get("id") == 21100537
                  and r.get("name") == "ProdKit immutable semantic release tags"
                  and r.get("source_type") == "Organization"
                  and r.get("target") == "tag"
                  and r.get("enforcement") == "active"
              ),
              None,
          )
          if tag_rule is None:
              raise RuntimeError("expected organization immutable-tag ruleset is not active")

          print(
              "verified canonical ProdKit Control v0.0.0: "
              f"v0.0.0 -> {expected_sha}, release {release_id}, 69 assets; "
              "v0.0.1 release retired; historical v0.0.1 tag retained by active org immutable-tag rule"
          )

          for branch in ["docs/enterprise-architecture-baseline"]:
              if ref("heads", branch) is not None:
                  delete_branch(branch)
                  print(f"deleted branch {branch}")

          self_branch = (os.environ.get("GITHUB_HEAD_REF") or "").strip()
          if not self_branch:
              raise RuntimeError("cannot resolve finalizer branch")
          if ref("heads", self_branch) is not None:
              delete_branch(self_branch)
              print(f"deleted finalizer branch {self_branch}")
          PY

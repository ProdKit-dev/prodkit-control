name: Inspect v0.0.1 tag protection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: finalize-v0.0.0
  cancel-in-progress: true

jobs:
  inspect-rules:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Inspect repository rulesets affecting tags
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-rules-inspector",
          }

          def request(path: str):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"GET {path} -> HTTP {exc.code}: {exc.read().decode(errors='replace')}")
                  return exc.code, None

          status, payload = request(f"/repos/{repo}/rulesets?includes_parents=true&per_page=100")
          print(f"rulesets status={status}")
          print(json.dumps(payload, indent=2, sort_keys=True))
          if isinstance(payload, list):
              for item in payload:
                  if not isinstance(item, dict) or not isinstance(item.get("id"), int):
                      continue
                  rid = item["id"]
                  detail_status, detail = request(f"/repos/{repo}/rulesets/{rid}?includes_parents=true")
                  print(f"ruleset {rid} status={detail_status}")
                  print(json.dumps(detail, indent=2, sort_keys=True))
          PY

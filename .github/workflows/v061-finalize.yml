name: v0.6.1 Release Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'hotfix/v0.6.1-governance-safety' }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.0
          enable-cache: false
      - name: Normalize v0.6.1 release source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize_v061.py
          uv python install 3.13
          uv lock --python 3.13
          uv sync --all-packages --group dev --locked --python 3.13
          uv run --python 3.13 --no-sync python scripts/export_schemas.py
          uv run --python 3.13 --no-sync ruff format .
          uv run --python 3.13 --no-sync ruff check --fix .
          uv run --python 3.13 --no-sync ruff format --check .
          uv run --python 3.13 --no-sync ruff check .
          uv run --python 3.13 --no-sync python scripts/release_check.py --version 0.6.1
          rm -f scripts/finalize_v061.py .github/workflows/v061-finalize.yml
          python3 - <<'PY'
          from fnmatch import fnmatch
          from pathlib import Path
          import subprocess
          allowed_exact = {
              'CHANGELOG.md', 'ROADMAP.md', 'pyproject.toml', 'uv.lock',
              'docs/architecture/governance-lifecycle.md',
              'docs/operations/governance-lifecycle.md',
              'docs/releases/v0.6.1.md',
              'packages/python/prodkit-control-fastapi/src/prodkit_control_fastapi/app.py',
              'scripts/finalize_v061.py', '.github/workflows/v061-finalize.yml',
          }
          patterns = (
              'packages/python/**/pyproject.toml',
              'packages/python/**/__init__.py',
              'packages/typescript/**/package.json',
              'schemas/*.schema.json',
          )
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed_exact and not any(fnmatch(p, pat) for pat in patterns)]
          if unexpected:
              raise SystemExit(f'unexpected finalizer paths: {unexpected}')
          Path('.prodkit/v061-stage.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          PY
          while IFS= read -r path; do
            [[ -n "$path" ]] && git add -- "$path"
          done < .prodkit/v061-stage.txt
          rm -f .prodkit/v061-stage.txt
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: finalize v0.6.1 release candidate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

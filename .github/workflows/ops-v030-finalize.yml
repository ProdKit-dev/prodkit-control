name: Ops v0.3.0 Finalize

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  finalize:
    name: Finalize v0.3.0
    if: ${{ github.head_ref == 'ops/v0.3.0-finalize' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: "34061e89321c111c55d2fdd8bb60e235fd25e47d"
      VERSION: "0.3.0"
      OPERATOR_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Advance release finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          version = os.environ["VERSION"]
          tag = f"v{version}"
          operator_pr = int(os.environ["OPERATOR_PR"])
          state = json.loads(Path(".github/ops-v030-state.json").read_text(encoding="utf-8"))
          phase = state.get("phase")
          base = f"https://api.github.com/repos/{repo}/"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-control-v030-finalizer",
          }

          if not re.fullmatch(r"[0-9a-f]{40}", target):
              raise SystemExit("TARGET_SHA must be an exact lowercase commit SHA")

          def api(method: str, path: str, payload=None, *, accept=None, allow_404=False):
              h = dict(headers)
              if accept:
                  h["Accept"] = accept
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read()
                      if not raw:
                          return None
                      if accept == "application/octet-stream":
                          return raw
                      return json.loads(raw)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  if allow_404 and exc.code == 404:
                      return None
                  raise SystemExit(f"GitHub API {method} {path} failed: {exc.code} {body}") from exc

          def assert_exact_main() -> None:
              main = api("GET", "commits/main")
              if main.get("sha") != target:
                  raise SystemExit(f"main moved: expected {target}, actual {main.get('sha')}")
              print(f"EXACT_MAIN_OK {target}", flush=True)

          def list_runs(*, workflow=None, event=None, sha=None):
              params = {"per_page": "100"}
              if event:
                  params["event"] = event
              if sha:
                  params["head_sha"] = sha
              query = urllib.parse.urlencode(params)
              if workflow:
                  wf = urllib.parse.quote(workflow, safe="")
                  data = api("GET", f"actions/workflows/{wf}/runs?{query}")
              else:
                  data = api("GET", f"actions/runs?{query}")
              return data.get("workflow_runs", [])

          def latest_exact(workflow: str, event: str):
              rows = [
                  run for run in list_runs(workflow=workflow, event=event, sha=target)
                  if run.get("head_sha") == target and run.get("event") == event
              ]
              return max(rows, key=lambda x: x.get("id", 0)) if rows else None

          def resolve_tag_sha(tag_name: str):
              qtag = urllib.parse.quote(tag_name, safe="")
              ref = api("GET", f"git/ref/tags/{qtag}")
              obj = ref.get("object", {})
              seen = set()
              while obj.get("type") == "tag":
                  sha = obj.get("sha")
                  if not sha or sha in seen:
                      raise SystemExit("invalid/cyclic annotated tag")
                  seen.add(sha)
                  obj = api("GET", f"git/tags/{sha}").get("object", {})
              if obj.get("type") != "commit":
                  raise SystemExit(f"tag does not resolve to commit: {obj}")
              return obj.get("sha")

          assert_exact_main()

          if phase == "advance-release":
              required = {
                  "CI": ".github/workflows/ci.yml",
                  "Security": ".github/workflows/security.yml",
                  "CodeQL": ".github/workflows/codeql.yml",
              }
              push_runs = [
                  run for run in list_runs(event="push", sha=target)
                  if run.get("head_sha") == target and run.get("event") == "push"
              ]
              gate_ids = {}
              pending = {}
              for name, path in required.items():
                  matches = [run for run in push_runs if run.get("name") == name and run.get("path") == path]
                  matches.sort(key=lambda x: x.get("id", 0), reverse=True)
                  if not matches:
                      pending[name] = "missing"
                      continue
                  run = matches[0]
                  if run.get("status") == "completed" and run.get("conclusion") == "success":
                      gate_ids[name] = run.get("id")
                  elif run.get("status") == "completed":
                      raise SystemExit(
                          f"exact-main gate failed: {name} run={run.get('id')} conclusion={run.get('conclusion')}"
                      )
                  else:
                      pending[name] = f"{run.get('status')}#{run.get('id')}"
              if pending:
                  print("STATE_MAIN_GATES_PENDING " + json.dumps(pending, sort_keys=True), flush=True)
                  raise SystemExit(0)
              print("EXACT_MAIN_GATES_OK " + json.dumps(gate_ids, sort_keys=True), flush=True)

              proof = latest_exact("trusted-release-proof.yml", "workflow_dispatch")
              if proof is None:
                  api("POST", "actions/workflows/trusted-release-proof.yml/dispatches", {"ref": "main"})
                  print("STATE_PROOF_DISPATCHED", flush=True)
                  raise SystemExit(0)
              if proof.get("status") != "completed":
                  print(f"STATE_PROOF_PENDING id={proof.get('id')} status={proof.get('status')}", flush=True)
                  raise SystemExit(0)
              if proof.get("conclusion") != "success":
                  raise SystemExit(
                      f"Trusted Release Proof failed: run={proof.get('id')} conclusion={proof.get('conclusion')}"
                  )
              print(f"TRUSTED_RELEASE_PROOF_OK {proof.get('id')}", flush=True)

              release_run = latest_exact("release.yml", "workflow_dispatch")
              if release_run is None:
                  promotion = latest_exact("release-promotion.yml", "workflow_run")
                  if promotion and promotion.get("status") == "completed" and promotion.get("conclusion") not in ("success", "skipped"):
                      raise SystemExit(
                          f"Release Promotion failed: run={promotion.get('id')} conclusion={promotion.get('conclusion')}"
                      )
                  print(
                      "STATE_RELEASE_PROMOTION_PENDING "
                      + (f"id={promotion.get('id')} status={promotion.get('status')}" if promotion else "missing"),
                      flush=True,
                  )
                  raise SystemExit(0)
              if release_run.get("status") != "completed":
                  print(f"STATE_RELEASE_PENDING id={release_run.get('id')} status={release_run.get('status')}", flush=True)
                  raise SystemExit(0)
              if release_run.get("conclusion") != "success":
                  raise SystemExit(
                      f"Release failed: run={release_run.get('id')} conclusion={release_run.get('conclusion')}"
                  )
              print(f"RELEASE_WORKFLOW_OK {release_run.get('id')}", flush=True)

              verification = latest_exact("release-verification.yml", "workflow_dispatch")
              if verification is None:
                  print("STATE_VERIFICATION_PENDING missing", flush=True)
                  raise SystemExit(0)
              if verification.get("status") != "completed":
                  print(f"STATE_VERIFICATION_PENDING id={verification.get('id')} status={verification.get('status')}", flush=True)
                  raise SystemExit(0)
              if verification.get("conclusion") != "success":
                  raise SystemExit(
                      f"Release Verification failed: run={verification.get('id')} conclusion={verification.get('conclusion')}"
                  )
              print(f"RELEASE_VERIFICATION_OK {verification.get('id')}", flush=True)

              tag_sha = resolve_tag_sha(tag)
              if tag_sha != target:
                  raise SystemExit(f"immutable tag mismatch: {tag} -> {tag_sha}, expected {target}")

              qtag = urllib.parse.quote(tag, safe="")
              release = api("GET", f"releases/tags/{qtag}")
              if release.get("draft") or release.get("prerelease") or release.get("tag_name") != tag:
                  raise SystemExit("GitHub Release state/tag is invalid")
              release_id = int(release["id"])
              assets = api("GET", f"releases/{release_id}/assets?per_page=100")
              by_name = {asset["name"]: asset for asset in assets}
              if len(by_name) != len(assets):
                  raise SystemExit("duplicate release asset names")
              if "SHA256SUMS" not in by_name:
                  raise SystemExit("release missing SHA256SUMS")
              if not any(name.endswith(".spdx.json") for name in by_name):
                  raise SystemExit("release missing SPDX SBOM")

              sums_raw = api(
                  "GET",
                  f"releases/assets/{by_name['SHA256SUMS']['id']}",
                  accept="application/octet-stream",
              )
              expected = {}
              for raw_line in sums_raw.decode("utf-8").splitlines():
                  line = raw_line.strip()
                  if not line:
                      continue
                  parts = line.split(None, 1)
                  if len(parts) != 2 or not re.fullmatch(r"[0-9a-f]{64}", parts[0]):
                      raise SystemExit(f"invalid SHA256SUMS line: {raw_line!r}")
                  name = parts[1].lstrip("*")
                  if name in expected:
                      raise SystemExit(f"duplicate SHA256SUMS entry: {name}")
                  expected[name] = parts[0]
              payload_names = set(by_name) - {"SHA256SUMS"}
              if set(expected) != payload_names:
                  raise SystemExit("published asset/checksum set mismatch")
              for name in sorted(payload_names):
                  digest = by_name[name].get("digest")
                  if digest and digest != f"sha256:{expected[name]}":
                      raise SystemExit(f"GitHub asset digest mismatch: {name}")

              print(
                  "V0_3_0_RELEASE_COMPLETE "
                  + json.dumps(
                      {
                          "target_sha": target,
                          "tag_sha": tag_sha,
                          "gate_run_ids": gate_ids,
                          "proof_run_id": proof.get("id"),
                          "release_run_id": release_run.get("id"),
                          "verification_run_id": verification.get("id"),
                          "release_id": release_id,
                          "asset_count": len(assets),
                          "release_url": release.get("html_url"),
                      },
                      sort_keys=True,
                  ),
                  flush=True,
              )
              raise SystemExit(0)

          stale = [
              "feat/v0.3.0-portable-assurance",
              "ops/v0.3.0-bootstrap-base",
              "ops/v0.3.0-bootstrap-trigger",
          ]

          if phase == "cleanup-dry-run":
              before = {
                  int(r.get("id", 0))
                  for r in list_runs(workflow="branch-cleanup.yml", event="workflow_dispatch", sha=target)
              }
              api(
                  "POST",
                  "actions/workflows/branch-cleanup.yml/dispatches",
                  {
                      "ref": "main",
                      "inputs": {
                          "branches_json": json.dumps(stale, separators=(",", ":")),
                          "dry_run": "true",
                          "expected_default_sha": target,
                      },
                  },
              )
              run = None
              for _ in range(10):
                  time.sleep(1)
                  candidates = [
                      r for r in list_runs(workflow="branch-cleanup.yml", event="workflow_dispatch", sha=target)
                      if int(r.get("id", 0)) not in before
                  ]
                  if candidates:
                      run = max(candidates, key=lambda x: x.get("id", 0))
                      break
              print(
                  f"CLEANUP_DRY_RUN_DISPATCHED id={run.get('id') if run else 'discover-later'}",
                  flush=True,
              )
              raise SystemExit(0)

          if phase == "cleanup-real":
              dry_run_id = int(state.get("dry_run_id") or 0)
              if dry_run_id <= 0:
                  raise SystemExit("cleanup-real requires dry_run_id")
              dry = api("GET", f"actions/runs/{dry_run_id}")
              if (
                  dry.get("head_sha") != target
                  or dry.get("event") != "workflow_dispatch"
                  or dry.get("path") != ".github/workflows/branch-cleanup.yml"
                  or dry.get("status") != "completed"
                  or dry.get("conclusion") != "success"
              ):
                  raise SystemExit(f"cleanup dry-run proof invalid: {json.dumps(dry, sort_keys=True)}")

              api("PATCH", f"pulls/{operator_pr}", {"state": "closed"})
              real_targets = stale + ["ops/v0.3.0-finalize"]
              before = {
                  int(r.get("id", 0))
                  for r in list_runs(workflow="branch-cleanup.yml", event="workflow_dispatch", sha=target)
              }
              api(
                  "POST",
                  "actions/workflows/branch-cleanup.yml/dispatches",
                  {
                      "ref": "main",
                      "inputs": {
                          "branches_json": json.dumps(real_targets, separators=(",", ":")),
                          "dry_run": "false",
                          "expected_default_sha": target,
                      },
                  },
              )
              run = None
              for _ in range(10):
                  time.sleep(1)
                  candidates = [
                      r for r in list_runs(workflow="branch-cleanup.yml", event="workflow_dispatch", sha=target)
                      if int(r.get("id", 0)) not in before
                  ]
                  if candidates:
                      run = max(candidates, key=lambda x: x.get("id", 0))
                      break
              print(
                  f"CLEANUP_REAL_DISPATCHED id={run.get('id') if run else 'discover-later'} targets={json.dumps(real_targets)}",
                  flush=True,
              )
              raise SystemExit(0)

          raise SystemExit(f"unknown finalizer phase: {phase!r}")
          PY

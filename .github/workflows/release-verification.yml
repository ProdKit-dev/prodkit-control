name: Release Verification

run-name: Release Verification — ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Exact parent Release run ID; leave blank only for manual re-verification after Release completed
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  verification:
    name: verification
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-verification.yml@e77861d685e0aaaabd43a385c9f26297d3598792
    with:
      source_sha: ${{ github.sha }}
      release_run_id: ${{ inputs.release_run_id }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml
      automatic_cleanup: true
      cleanup_workflow_file: branch-cleanup.yml
      main_branch: main
      cleanup_branch_prefixes_json: '["release/","hotfix/"]'

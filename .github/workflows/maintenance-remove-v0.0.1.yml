name: Maintenance Remove v0.0.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: maintenance-remove-v0.0.1
  cancel-in-progress: false

jobs:
  remove:
    name: remove obsolete v0.0.1 release and tag
    if: ${{ github.head_ref == 'maintenance/remove-v0.0.1' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Delete obsolete release and tag, then self-clean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          get_code() {
            local url="$1"
            local output="$2"
            curl --silent --show-error --location "${auth[@]}" --output "$output" --write-out '%{http_code}' "$url"
          }

          delete_expect_204() {
            local url="$1"
            local output="$2"
            local code
            code="$(curl --silent --show-error --location --request DELETE "${auth[@]}" --output "$output" --write-out '%{http_code}' "$url")"
            if [[ "$code" != "204" ]]; then
              echo "DELETE $url returned HTTP $code" >&2
              cat "$output" >&2 || true
              exit 1
            fi
          }

          release_body="$(mktemp)"
          release_code="$(get_code "${API}/releases/tags/v0.0.1" "$release_body")"
          case "$release_code" in
            200)
              release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$release_body")"
              delete_expect_204 "${API}/releases/${release_id}" "$(mktemp)"
              ;;
            404) ;;
            *)
              echo "Release lookup returned HTTP $release_code" >&2
              cat "$release_body" >&2 || true
              exit 1
              ;;
          esac

          tag_body="$(mktemp)"
          tag_code="$(get_code "${API}/git/ref/tags/v0.0.1" "$tag_body")"
          case "$tag_code" in
            200) delete_expect_204 "${API}/git/refs/tags/v0.0.1" "$(mktemp)" ;;
            404) ;;
            *)
              echo "Tag lookup returned HTTP $tag_code" >&2
              cat "$tag_body" >&2 || true
              exit 1
              ;;
          esac

          release_verify="$(get_code "${API}/releases/tags/v0.0.1" "$(mktemp)")"
          tag_verify="$(get_code "${API}/git/ref/tags/v0.0.1" "$(mktemp)")"
          if [[ "$release_verify" != "404" || "$tag_verify" != "404" ]]; then
            echo "Cleanup verification failed: release=$release_verify tag=$tag_verify" >&2
            exit 1
          fi

          delete_expect_204 "${API}/git/refs/heads/maintenance/remove-v0.0.1" "$(mktemp)"

          status_payload="$(mktemp)"
          python3 - "$status_payload" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "state": "success",
                      "context": "maintenance/v0.0.1-cleanup",
                      "description": "v0.0.1 release/tag removed; maintenance branch deleted",
                  },
                  handle,
              )
          PY
          status_response="$(mktemp)"
          status_code="$(curl --silent --show-error --location --request POST "${auth[@]}" -H 'Content-Type: application/json' --data-binary "@${status_payload}" --output "$status_response" --write-out '%{http_code}' "${API}/statuses/${SOURCE_SHA}")"
          if [[ "$status_code" != "201" ]]; then
            echo "Status publication returned HTTP $status_code" >&2
            cat "$status_response" >&2 || true
            exit 1
          fi

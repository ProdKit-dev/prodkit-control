name: v0.5.0 Finalize Candidate

on:
  push:
    branches:
      - release/v0.5.0-multi-tenant-isolation

permissions:
  contents: write

concurrency:
  group: v050-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.5.0-multi-tenant-isolation
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Normalize v0.5.0 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize_v050.py
          uv python install 3.13
          uv lock --python 3.13
          uv sync --all-packages --group dev --locked --python 3.13
          uv run --python 3.13 --no-sync python scripts/export_schemas.py
          uv run --python 3.13 --no-sync ruff format .
          uv run --python 3.13 --no-sync ruff check --fix .
          uv run --python 3.13 --no-sync ruff format --check .
          uv run --python 3.13 --no-sync ruff check .
          python3 scripts/release_check.py --version 0.5.0
          git config user.name 'prodkit-release-bot'
          git config user.email 'prodkit-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize v0.5.0 release candidate'
          git push origin HEAD:release/v0.5.0-multi-tenant-isolation

# retriggered after exact-head semantic qualification passed

name: Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-v020:
    name: normalize-v0.2.0
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-control-v020-normalizer.yml@cebfbceac578e7d088c9106880ef3e3691725f32
    with:
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      main_sha: 89a7546ec06a2eecc59d2150c037d25c866a1538

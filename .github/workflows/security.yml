name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner target for explicit failover
        required: true
        type: choice
        default: github-hosted
        options: [github-hosted, self-hosted]
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-security.yml@2decc8b2240a815de62ce2de7d0c42297288988e
    with:
      runner_json: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      secret_scan_enabled: true
      gitleaks_config_path: .gitleaks.toml
      sbom_enabled: true
      python_enabled: true
      python_script: .prodkit/workflows/security-python.sh
      node_enabled: true
      node_script: .prodkit/workflows/security-node.sh
      container_enabled: false
      custom_enabled: false

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'ops/final-v0.1.0-closure' }}
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-security-compact.yml@645f3c66557e4a673be38c461a762021536fda00
    with:
      runner_json: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || (vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
      secret_scan_enabled: true
      gitleaks_config_path: .gitleaks.toml
      sbom_enabled: true
      python_enabled: true
      python_script: .prodkit/workflows/security-python.sh
      node_enabled: true
      node_script: .prodkit/workflows/security-node.sh
      container_enabled: false
      custom_enabled: false

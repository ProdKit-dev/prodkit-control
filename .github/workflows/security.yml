name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - auto
          - github-hosted
          - self-hosted
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-probe:
    name: Hosted runner availability
    if: >-
      (((github.event_name == 'workflow_dispatch') &&
        ((inputs.runner == 'auto') ||
         ((inputs.runner == 'policy') &&
          ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto'))))) ||
       ((github.event_name != 'workflow_dispatch') &&
        ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))) &&
      ((github.event_name != 'pull_request') ||
       (github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        name: Confirm GitHub-hosted runner availability
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  security:
    name: security
    needs: runner-probe
    if: always() && !cancelled()
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-security.yml@a19315d6b0a301f8d641d223692fdc85b2409835
    with:
      runner_json: >-
        ${{ (
          (
            ((github.event_name == 'workflow_dispatch') && (inputs.runner == 'self-hosted')) ||
            ((github.event_name == 'workflow_dispatch') && (inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted')) ||
            ((github.event_name != 'workflow_dispatch') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted')) ||
            (
              (
                ((github.event_name == 'workflow_dispatch') && (inputs.runner == 'auto')) ||
                ((github.event_name == 'workflow_dispatch') && (inputs.runner == 'policy') && ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto'))) ||
                ((github.event_name != 'workflow_dispatch') && ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))
              ) &&
              (needs.runner-probe.outputs.available != 'true')
            )
          ) &&
          ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository))
        ) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      secret_scan_enabled: true
      gitleaks_config_path: .gitleaks.toml
      sbom_enabled: true
      python_enabled: true
      python_script: .prodkit/workflows/security-python.sh
      node_enabled: true
      node_script: .prodkit/workflows/security-node.sh
      container_enabled: false
      custom_enabled: false

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: prodkit
      POSTGRES_PASSWORD: prodkit
      POSTGRES_DB: prodkit_control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodkit -d prodkit_control"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifact-data:/var/lib/prodkit/artifacts
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  artifact-data:
